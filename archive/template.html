<title>근원경쟁력 유사도 네트워크 — 프로토타입</title>
<style>
  :root{
    --bg: #07080b;
    --panel: rgba(20, 23, 31, 0.74);
    --panel-border: rgba(255, 255, 255, 0.09);
    --ink: #f1f3f7;
    --ink-dim: #8b93a3;
    --ink-faint: #545c6b;
    --gold: #f3cc73;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(87,201,189,0.07), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(242,161,84,0.05), transparent 55%),
      var(--bg);
  }

  #graph{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas.dragging{ cursor: grabbing; }

  .topbar{
    position: absolute;
    top: clamp(18px, 3vh, 32px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .topbar h1{
    margin: 0;
    font-size: clamp(18px, 2.1vw, 26px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .topbar .sub{
    margin-top: 6px;
    font-size: clamp(12px, 1vw, 14px);
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .badge{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #1a1608;
    background: var(--gold);
  }
  .badge::before{
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #1a1608;
    opacity: 0.6;
  }

  .panel{
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .search-panel{
    top: clamp(18px, 3vh, 32px);
    left: clamp(18px, 3vw, 32px);
    width: min(280px, 30vw);
    padding: 10px;
    z-index: 6;
  }
  .search-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 9px;
    background: rgba(255,255,255,0.04);
  }
  .search-row svg{ flex: none; opacity: 0.55; }
  #searchInput{
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
  }
  #searchInput::placeholder{ color: var(--ink-faint); }
  .search-row:focus-within{ box-shadow: 0 0 0 2px var(--gold); }
  #clearBtn{
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    display: none;
  }
  #clearBtn:hover{ color: var(--ink); }
  #clearBtn:focus-visible{ outline: 2px solid var(--gold); border-radius: 4px; }

  .search-results{ max-height: 260px; overflow-y: auto; margin-top: 6px; }
  .result-item{
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 8px; background: none; border: none;
    color: var(--ink); font-family: var(--sans); font-size: 13.5px; cursor: pointer;
  }
  .result-item:hover, .result-item:focus-visible{ background: rgba(255,255,255,0.07); outline: none; }
  .dot{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .result-item .team-name{ color: var(--ink-faint); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
  .search-count{ font-size: 11px; color: var(--ink-faint); padding: 4px 8px 0; }

  .side-panel{
    left: clamp(18px, 3vw, 32px);
    bottom: clamp(18px, 3vh, 28px);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 5;
    width: min(240px, 28vw);
  }
  .panel-title{
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint);
  }
  .isolate-clear{
    background: none; border: none; color: var(--gold); font-family: var(--sans);
    font-size: 10.5px; font-weight: 700; cursor: pointer; letter-spacing: 0; text-transform: none;
    padding: 0;
  }
  .isolate-clear:hover{ text-decoration: underline; }
  .legend-list{ display: flex; flex-direction: column; gap: 2px; }
  .team-chip{
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim);
    background: none; border: none; width: 100%; text-align: left; padding: 5px 4px;
    border-radius: 7px; cursor: pointer; font-family: var(--sans);
  }
  .team-chip:hover{ background: rgba(255,255,255,0.05); }
  .team-chip:focus-visible{ outline: 2px solid var(--gold); }
  .team-chip.dimmed-off{ opacity: 0.4; }
  .team-chip.isolated{ color: var(--ink); background: rgba(255,255,255,0.07); }
  .team-chip .dot{ width: 9px; height: 9px; }
  .team-chip .count{ margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

  .topn-row{
    padding-top: 10px; border-top: 1px solid var(--panel-border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .topn-label{ display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }
  .topn-label b{ color: var(--gold); font-family: var(--mono); font-weight: 600; }
  #topnSlider{ width: 100%; accent-color: var(--gold); }
  #topnSlider:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }
  .hint{ font-size: 10.5px; color: var(--ink-faint); line-height: 1.5; }

  .reset-btn{
    position: absolute;
    left: 50%; /* 우하단은 워드클라우드 패널(005) 자리 */
    bottom: clamp(18px, 3vh, 28px);
    z-index: 6;
    padding: 10px 16px;
    border-radius: 100px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(16px);
    color: var(--ink-dim);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    transform: translate(-50%, 6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .reset-btn.visible{ opacity: 1; transform: translate(-50%, 0); color: var(--ink); }
  .reset-btn:hover{ border-color: rgba(255,255,255,0.2); }
  .reset-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .detail-panel{
    top: clamp(18px, 3vh, 32px);
    right: clamp(18px, 3vw, 32px);
    width: min(320px, 32vw);
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding: 20px;
    z-index: 6;
    opacity: 0;
    transform: translateX(16px);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .detail-panel.visible{ opacity: 1; transform: translateX(0); pointer-events: auto; }

  .detail-name{ font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .detail-team{
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    padding: 3px 10px 3px 8px; border-radius: 100px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.06);
  }
  .detail-flavor{
    margin-top: 14px; font-size: 13px; line-height: 1.6; color: var(--ink-dim);
    padding-top: 12px; border-top: 1px solid var(--panel-border);
  }
  .detail-flavor .label{
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); margin-bottom: 5px;
  }
  .md-body{
    max-height: 200px; overflow-y: auto; margin-top: 4px;
    font-size: 12.5px; line-height: 1.6; color: var(--ink-dim); overflow-wrap: anywhere;
  }
  .md-body h1, .md-body h2, .md-body h3{ color: var(--ink); margin: 10px 0 3px; }
  .md-body h1{ font-size: 13.5px; }
  .md-body h2{ font-size: 12.5px; }
  .md-body h3{ font-size: 12px; }
  .md-body h1:first-child, .md-body h2:first-child{ margin-top: 0; }
  .md-body p{ margin: 3px 0; }
  .md-body ul{ margin: 3px 0; padding-left: 16px; }

  .neighbor-label{
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--panel-border);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 10px;
  }
  .neighbor-list{ display: flex; flex-direction: column; gap: 3px; }
  .neighbor-item{
    display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 9px; width: 100%;
    background: none; border: none; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    text-align: left; color: var(--ink); font-family: var(--sans);
  }
  .neighbor-item:hover, .neighbor-item:focus-visible{ background: rgba(255,255,255,0.06); outline: none; }
  .neighbor-item .n-name{ font-size: 13.5px; }
  .neighbor-item .n-score{ font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .neighbor-item .n-bar-track{
    grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06);
    margin-top: 2px; overflow: hidden;
  }
  .neighbor-item .n-bar-fill{ height: 100%; border-radius: 2px; }

  .hover-tip{
    position: absolute;
    z-index: 7;
    pointer-events: none;
    background: rgba(8,9,13,0.92);
    border: 1px solid var(--panel-border);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    transform: translate(-50%, -140%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .hover-tip.show{ opacity: 1; }
  .hover-tip .pct{ color: var(--gold); font-family: var(--mono); font-weight: 700; margin-left: 6px; }
  .hover-tip .team{ color: var(--ink-faint); font-weight: 500; }

  .tag-chips{ display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .tag-chip{
    background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); border-radius: 100px;
    color: var(--ink-dim); font-family: var(--sans); font-size: 11.5px; padding: 4px 10px; cursor: pointer;
  }
  .tag-chip:hover{ color: var(--ink); border-color: rgba(255,255,255,0.25); }
  .tag-filter-pill{
    position: absolute; top: clamp(70px, 10vh, 96px); left: 50%; transform: translateX(-50%); z-index: 6;
    display: none; align-items: center; gap: 7px;
    background: var(--panel); backdrop-filter: blur(16px); border: 1px solid var(--gold); border-radius: 100px;
    color: var(--gold); font-family: var(--sans); font-size: 12.5px; padding: 7px 14px; cursor: pointer;
  }
  .tag-filter-pill.visible{ display: inline-flex; }

  .cloud-panel{
    right: clamp(18px, 3vw, 32px);
    bottom: clamp(18px, 3vh, 28px);
    width: 360px;
    padding: 12px 14px;
  }
  .cloud-tabs{ display: flex; gap: 6px; margin: 9px 0 10px; }
  .cloud-tabs button{
    flex: 1; background: none; border: 1px solid var(--panel-border); border-radius: 7px;
    color: var(--ink-dim); font-family: var(--sans); font-size: 12px; padding: 5px 0; cursor: pointer;
  }
  .cloud-tabs button.active{ color: var(--ink); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }
  .cloud-tabs button:disabled{ opacity: 0.35; cursor: default; }
  .cloud-select{
    width: 100%; margin-bottom: 8px; background: rgba(255,255,255,0.06); color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 7px; padding: 5px 8px;
    font-family: var(--sans); font-size: 12.5px;
  }
  #cloudCanvas{ width: 100%; height: 210px; display: block; }
  .cloud-note{ font-size: 11px; color: var(--ink-faint); margin-top: 7px; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce){
    .reset-btn, .detail-panel, .hover-tip{ transition: none; }
  }
</style>

<div class="stage">
  <canvas id="graph"></canvas>
  <div class="hover-tip" id="hoverTip"></div>

  <header class="topbar">
    <h1>근원경쟁력 유사도 네트워크</h1>
    <div class="sub">
      <span>2026 Q2 분기회 라이브 데모</span>
      <span class="badge">프로토타입 · 더미 데이터</span>
    </div>
  </header>

  <div class="panel search-panel">
    <div class="search-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="이름으로 검색 (150명)" autocomplete="off" />
      <button id="clearBtn" aria-label="검색어 지우기" title="검색어 지우기">×</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="panel side-panel">
    <div>
      <div class="panel-title">
        <span>소속팀 (클릭: dim · 더블클릭: 이 팀만)</span>
        <button class="isolate-clear" id="isolateClear" style="display:none">전체 팀 보기</button>
      </div>
      <div class="legend-list" id="legend"></div>
    </div>
    <div class="topn-row">
      <div class="topn-label"><span>전체 뷰 연결 수 (Top-N)</span><b id="topnValue">5</b></div>
      <input type="range" id="topnSlider" min="2" max="__TOPN_MAX__" value="5" step="1" aria-label="전체 뷰에서 인당 유사도 상위 N명 연결" />
      <div class="hint">인물 클릭 시엔 유사도 상위 10명 궤도 뷰로 전환됩니다.</div>
    </div>
  </div>

  <button class="tag-filter-pill" id="tagPill" title="클릭하면 태그 필터 해제"></button>

  <div class="panel cloud-panel">
    <div class="panel-title"><span>근원경쟁력 워드클라우드</span></div>
    <div class="cloud-tabs" id="cloudTabs">
      <button data-scope="all" class="active">전체</button>
      <button data-scope="team">팀별</button>
      <button data-scope="cl">CL별</button>
      <button data-scope="ego" id="cloudEgoTab" disabled>유사군</button>
    </div>
    <select class="cloud-select" id="cloudSelect" style="display:none" aria-label="워드클라우드 대상 선택"></select>
    <canvas id="cloudCanvas" width="680" height="420"></canvas>
    <div class="cloud-note" id="cloudNote"></div>
  </div>

  <button class="reset-btn" id="resetBtn">전체 뷰로 돌아가기</button>

  <aside class="panel detail-panel" id="detailPanel"></aside>
</div>

<script>/*__WORDCLOUD2_JS__*/</script>
<script>/*__CLOUD_LOGIC_JS__*/</script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // 데이터: 빌드 타임에 1회 계산된 결과라고 가정한다.
  // 실제 파이프라인: PPT 텍스트 추출 -> 사내 임베딩 -> 코사인 유사도
  // -> 인당 top-12(kMax) 이웃을 미리 저장해두고, 화면에서는 Top-N
  // 슬라이더로 전체 뷰의 엣지 수만 조절한다 (전량 재계산 없음).
  // 150명 실데이터가 아직 없어 동일 스키마의 더미 인물로 재현했다.
  // ---------------------------------------------------------------
  var DATA = /*__DATA__*/null;
  var FREQ = /*__FREQ__*/null; // 워드클라우드(005) 인당 단어 빈도

  var PALETTE = ["#f2a154","#57c9bd","#7c9ce6","#e0819f","#9bd66b","#c792ea","#e8d15a","#5ab4d6","#d98a6a","#8fb4a8","#b3a1e6","#dd7f7f"];
  var TEAM_COLOR = {};
  DATA.nodes.forEach(function(n){
    if (!(n.team in TEAM_COLOR)) TEAM_COLOR[n.team] = PALETTE[Object.keys(TEAM_COLOR).length % PALETTE.length];
  });
  var GOLD = "#f3cc73";
  var DEFAULT_COLOR = "#9aa4b2";
  var EGO_N = /*__EGO_DISPLAY_N__*/10;
  var EGO_TRANSITION_MS = 750;
  var REVEAL_STAGGER_MS = 55;
  var RIPPLE_MS = 550;

  var nodes = DATA.nodes.map(function(n){
    return {
      id: n.id, name: n.name, team: n.team, tags: n.tags || [], text: n.text || "",
      x: 0, y: 0, vx: 0, vy: 0, r: 5, _placed: false,
      visible: true
    };
  });
  var byId = {};
  nodes.forEach(function(n){ byId[n.id] = n; });

  // neighbors: 인당 top-kMax 후보 (JSON 키는 문자열 id), 유사도 내림차순
  var neighborsFull = {};
  Object.keys(DATA.neighbors).forEach(function(idStr){
    neighborsFull[idStr] = DATA.neighbors[idStr].map(function(e){ return { node: byId[e.id], w: e.w }; });
  });

  // ---------------- 팀 필터 / 격리 상태 ----------------
  var filterTeams = {};   // team -> true (dim 처리 대상 아님, 강조 표시)
  var isolateTeam = null; // 특정 팀만 남기고 나머지 완전히 숨김 + 재배치

  function isFilterActive(){ return Object.keys(filterTeams).length > 0; }

  function activeNodeList(){
    return isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;
  }

  // ---------------- Top-N 전체 뷰 엣지 ----------------
  var topN = 5;
  var edges = [];
  var adjacency = {}; // node.id -> [{node, w}] 내림차순, 현재 표시 중인 그래프 기준

  function rebuildEdges(){
    var visibleSet = {};
    activeNodeList().forEach(function(n){ visibleSet[n.id] = true; });

    var seen = {};
    var list = [];
    nodes.forEach(function(n){ adjacency[n.id] = []; });

    activeNodeList().forEach(function(n){
      var cands = neighborsFull[n.id].filter(function(c){ return visibleSet[c.node.id]; }).slice(0, topN);
      cands.forEach(function(c){
        var key = n.id < c.node.id ? n.id + "_" + c.node.id : c.node.id + "_" + n.id;
        if (!seen[key]){
          seen[key] = true;
          list.push({ a: n, b: c.node, w: c.w });
        }
      });
    });
    list.forEach(function(e){
      adjacency[e.a.id].push({ node: e.b, w: e.w });
      adjacency[e.b.id].push({ node: e.a, w: e.w });
    });
    Object.keys(adjacency).forEach(function(id){
      adjacency[id].sort(function(a, b){ return b.w - a.w; });
    });
    edges = list;

    nodes.forEach(function(n){ n.visible = visibleSet[n.id]; });
  }
  rebuildEdges();

  // ---------------- 글로우 스프라이트 (네온 효과, shadowBlur 대신 캐시된 스프라이트 사용) ----------------
  var glowCache = {};
  function getGlowSprite(hex){
    if (glowCache[hex]) return glowCache[hex];
    var size = 96;
    var c = document.createElement("canvas");
    c.width = size; c.height = size;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, hexToRgba(hex, 0.55));
    grad.addColorStop(0.4, hexToRgba(hex, 0.22));
    grad.addColorStop(1, hexToRgba(hex, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    glowCache[hex] = c;
    return c;
  }
  function hexToRgba(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  // ---------------- 레이아웃 (간이 force-directed 시뮬레이션) ----------------
  var canvas = document.getElementById("graph");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // 빅뱅 인트로: 전 노드를 중앙 근처에 아주 좁게 모아 시작 -> 반발력으로 확산
  (function seedPositions(){
    var cx = 0.5, cy = 0.5;
    nodes.forEach(function(n){
      var a = Math.random() * Math.PI * 2;
      var rad = Math.random() * 0.01;
      n.ux = cx + Math.cos(a) * rad;
      n.uy = cy + Math.sin(a) * rad;
    });
  })();

  var alpha = 1, alphaDecay = 0.006, alphaMin = 0.012;

  function degreeOf(id){ return adjacency[id] ? adjacency[id].length : 0; }
  var maxDegree = 1;
  function recomputeMaxDegree(){
    maxDegree = 1;
    activeNodeList().forEach(function(n){ maxDegree = Math.max(maxDegree, degreeOf(n.id)); });
  }
  recomputeMaxDegree();

  function overviewRadius(n){
    var d = degreeOf(n.id);
    return 3 + Math.pow(d / maxDegree, 0.7) * 16;
  }

  function tick(){
    if (alpha < alphaMin) alpha = alphaMin;
    var cx = W / 2, cy = H / 2;
    var i, j, n1, n2;
    var active = activeNodeList();

    active.forEach(function(n){
      if (!n._placed){
        n.x = n.ux * W;
        n.y = n.uy * H;
        n._placed = true;
      }
    });

    var isEgoFrozen = viewMode === "ego"; // ego 모드에선 배경 노드 물리 정지, 전경만 애니메이션으로 이동

    if (!isEgoFrozen){
      var repulseK = 900 * (W / 1400);
      for (i = 0; i < active.length; i++){
        n1 = active[i];
        for (j = i + 1; j < active.length; j++){
          n2 = active[j];
          var dx = n1.x - n2.x, dy = n1.y - n2.y;
          var distSq = dx * dx + dy * dy + 0.01;
          if (distSq > 260000) continue;
          var dist = Math.sqrt(distSq);
          var force = repulseK / distSq;
          var fx = (dx / dist) * force, fy = (dy / dist) * force;
          n1.vx += fx; n1.vy += fy;
          n2.vx -= fx; n2.vy -= fy;
        }
      }

      edges.forEach(function(e){
        var dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var restLen = (1 - Math.max(e.w, 0)) * 180 + 34;
        var k = 0.02 + Math.max(e.w, 0) * 0.03;
        var f = (dist - restLen) * k;
        var fx = (dx / dist) * f, fy = (dy / dist) * f;
        e.a.vx += fx; e.a.vy += fy;
        e.b.vx -= fx; e.b.vy -= fy;
      });

      var exitingIds = (egoAnim && egoAnim.exiting) ? {} : null;
      if (exitingIds) egoAnim.entries.forEach(function(entry){ exitingIds[entry.node.id] = true; });

      active.forEach(function(n){
        if (n === dragNode){
          n.x = dragPos.x; n.y = dragPos.y;
          n.vx = 0; n.vy = 0;
          return;
        }
        if (exitingIds && exitingIds[n.id]){
          // 에고 종료 애니메이션이 좌표를 직접 제어하는 동안은 속도 누적을 막는다
          n.vx = 0; n.vy = 0;
          return;
        }
        n.vx += (cx - n.x) * 0.0012;
        n.vy += (cy - n.y) * 0.0012;
        n.vx *= 0.8;
        n.vy *= 0.8;
        n.x += n.vx * alpha;
        n.y += n.vy * alpha;
        var pad = 24;
        n.x = Math.max(pad, Math.min(W - pad, n.x));
        n.y = Math.max(pad, Math.min(H - pad, n.y));
      });

      active.forEach(function(n){ n.homeX = n.x; n.homeY = n.y; });
      alpha *= (1 - alphaDecay);
    }

    updateEgoTransition();
  }

  // ---------------- 에고 뷰 (선택 인물 중앙 배치 + 상위 10명 궤도) ----------------
  var viewMode = "overview"; // "overview" | "ego"
  var selectedId = null;
  var egoNeighbors = []; // [{node, w}] 내림차순, 궤도 목표 좌표 포함
  var egoAnim = null;    // { start, duration, entries: [{node, fromX, fromY, toX, toY, fromR, toR}] }
  var egoRevealStart = null;
  var ripples = [];

  function egoTargets(id){
    var center = byId[id];
    var neighbors = adjacency[id].slice(0, EGO_N);
    var cx = W / 2, cy = H / 2;
    var entries = [{ node: center, tx: cx, ty: cy, tr: 15 }];
    var n = neighbors.length;
    neighbors.forEach(function(nb, i){
      var angle = (i / Math.max(n, 1)) * Math.PI * 2 - Math.PI / 2;
      var dist = 235 - nb.w * 150; // 유사도 높을수록 가깝게
      dist = Math.max(70, Math.min(dist, Math.min(W, H) * 0.42));
      var r = 6 + Math.max(nb.w, 0) * 13;
      entries.push({ node: nb.node, tx: cx + Math.cos(angle) * dist, ty: cy + Math.sin(angle) * dist, tr: r });
    });
    return { neighbors: neighbors, entries: entries };
  }

  function enterEgo(id){
    if (viewMode === "ego" && id === selectedId) return;
    if (viewMode === "ego"){
      // 이전 에고 전경(선택 인물+이웃)을 실제 오버뷰 위치로 되돌려 놓은 뒤 다음 전환을 계산한다
      var prevFg = [byId[selectedId]].concat(egoNeighbors.map(function(nb){ return nb.node; }));
      prevFg.forEach(function(n){
        if (n.homeX != null){ n.x = n.homeX; n.y = n.homeY; }
        n.animR = null;
      });
    }
    var target = egoTargets(id);
    var entries = target.entries.map(function(e){
      var curR = e.node.animR != null ? e.node.animR : overviewRadius(e.node);
      return { node: e.node, fromX: e.node.x, fromY: e.node.y, toX: e.tx, toY: e.ty, fromR: curR, toR: e.tr };
    });
    selectedId = id;
    egoNeighbors = target.neighbors;
    viewMode = "ego";
    egoAnim = { start: performance.now(), duration: EGO_TRANSITION_MS, entries: entries };
    egoRevealStart = performance.now() + EGO_TRANSITION_MS;
    ripples.push({ x: byId[id].x, y: byId[id].y, color: TEAM_COLOR[byId[id].team] || DEFAULT_COLOR, start: performance.now() });
    alpha = Math.max(alpha, 0.05);
    renderDetail();
    resetBtn.classList.add("visible");
    cloudEgoTab.disabled = false;
    setCloudScope("ego"); // 유사군 클라우드 자동 연동
  }

  function exitEgo(){
    if (viewMode !== "ego") return;
    var fg = [byId[selectedId]].concat(egoNeighbors.map(function(nb){ return nb.node; }));
    var entries = fg.map(function(n){
      return { node: n, fromX: n.x, fromY: n.y, toX: n.homeX != null ? n.homeX : n.x, toY: n.homeY != null ? n.homeY : n.y };
    });
    // 복귀: 에고 진입 직전의 오버뷰 좌표(homeX/Y)로 부드럽게 돌아간 뒤 물리 재개
    egoAnim = { start: performance.now(), duration: EGO_TRANSITION_MS, entries: entries, exiting: true };
    viewMode = "overview";
    selectedId = null;
    egoNeighbors = [];
    egoRevealStart = null;
    detailPanel.classList.remove("visible");
    resetBtn.classList.remove("visible");
    alpha = Math.max(alpha, 0.35);
    cloudEgoTab.disabled = true;
    if (cloudScope === "ego") setCloudScope("all");
  }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  function updateEgoTransition(){
    if (!egoAnim) return;
    var now = performance.now();
    var t = Math.min(1, (now - egoAnim.start) / egoAnim.duration);
    var e = easeOutCubic(t);
    egoAnim.entries.forEach(function(entry){
      entry.node.x = entry.fromX + (entry.toX - entry.fromX) * e;
      entry.node.y = entry.fromY + (entry.toY - entry.fromY) * e;
      if (entry.toR !== undefined){
        entry.node.animR = (entry.fromR || entry.node.r) + ((entry.toR - (entry.fromR || entry.node.r)) * e);
      }
    });
    if (t >= 1){
      if (egoAnim.exiting){
        egoAnim.entries.forEach(function(entry){ entry.node.animR = null; });
      }
      egoAnim = null;
    }
  }

  // ---------------- 인터랙션 상태 ----------------
  var hoverId = null;
  var dragNode = null;
  var dragPos = { x: 0, y: 0 };
  var dragMoved = false;
  var downPos = null;

  function egoActiveIds(){
    if (viewMode !== "ego") return null;
    var set = {};
    set[selectedId] = true;
    egoNeighbors.forEach(function(nb){ set[nb.node.id] = true; });
    return set;
  }

  function revealedCount(){
    if (egoRevealStart === null) return egoNeighbors.length;
    var elapsed = performance.now() - egoRevealStart;
    if (elapsed <= 0) return 0;
    return Math.min(egoNeighbors.length, Math.floor(elapsed / REVEAL_STAGGER_MS) + 1);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    var active = egoActiveIds();
    var revealed = active ? revealedCount() : 0;
    var revealedIds = null;
    if (active){
      revealedIds = {};
      for (var i = 0; i < revealed; i++) revealedIds[egoNeighbors[i].node.id] = true;
    }

    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;

    // 엣지
    if (active){
      // 에고 모드: 선택 인물 -> 공개된 이웃까지만 순차 점등 (막 나타난 엣지는 페이드인)
      var revealNow = performance.now();
      egoNeighbors.forEach(function(nb, i){
        if (i >= revealed) return;
        var sel = byId[selectedId];
        var fadeT = Math.min(1, Math.max(0, (revealNow - (egoRevealStart + i * REVEAL_STAGGER_MS)) / REVEAL_STAGGER_MS));
        ctx.beginPath();
        ctx.moveTo(sel.x, sel.y);
        ctx.lineTo(nb.node.x, nb.node.y);
        ctx.strokeStyle = "rgba(243,204,115," + (fadeT * (0.4 + Math.max(nb.w, 0) * 0.45)) + ")";
        ctx.lineWidth = 1 + Math.max(nb.w, 0) * 4.5;
        ctx.stroke();

        // 공통 태그가 있을 때만 엣지 라벨 (억지 라벨 금지)
        var shared = commonTags(sel.tags, nb.node.tags);
        if (shared.length && fadeT >= 1){
          ctx.save();
          ctx.font = "500 10.5px " + getComputedStyle(document.body).fontFamily;
          ctx.fillStyle = "rgba(243,204,115,0.8)";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          // 중점이면 라벨끼리 중앙에 몰려 겹침 → 이웃 쪽으로 밀고 홀짝 엣지 거리를 교차시켜 분산
          var lt = 0.55 + (i % 2) * 0.2;
          ctx.fillText(shared.join(" · "), sel.x + (nb.node.x - sel.x) * lt, sel.y + (nb.node.y - sel.y) * lt - 8);
          ctx.restore();
        }
      });
    } else {
      edges.forEach(function(e){
        if (!e.a.visible || !e.b.visible) return;
        ctx.beginPath();
        ctx.moveTo(e.a.x, e.a.y);
        ctx.lineTo(e.b.x, e.b.y);
        ctx.strokeStyle = "rgba(180,190,205," + (0.06 + e.w * 0.2) + ")";
        ctx.lineWidth = 0.5 + Math.max(e.w, 0) * 1.3;
        ctx.stroke();
      });
    }

    // 노드
    pool.forEach(function(n){
      if (!n.visible) return;
      var inTeamFilter = !isFilterActive() || filterTeams[n.team];
      var dim = active ? !active[n.id] : !(inTeamFilter && passesTagFilter(n, filterTag));
      var isSelected = n.id === selectedId;
      var isHover = n.id === hoverId;
      var showLabel = active ? (isSelected || (revealedIds && revealedIds[n.id])) : isHover;
      var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
      var op = dim ? 0.13 : 1;
      var r = n.animR != null ? n.animR : (active ? n.r : overviewRadius(n));
      if (isHover && !isSelected) r += 1.5;

      ctx.save();
      ctx.globalAlpha = op;

      // 상시 네온 글로우 (dim 상태에선 은은하게만)
      var glow = getGlowSprite(color);
      var gs = r * (dim ? 3.2 : 5);
      ctx.globalAlpha = op * (dim ? 0.5 : 0.9);
      ctx.drawImage(glow, n.x - gs/2, n.y - gs/2, gs, gs);

      ctx.globalAlpha = op;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (isSelected){
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = GOLD;
        ctx.stroke();
      }
      ctx.restore();

      if (showLabel){
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.font = (isSelected ? "700 " : "500 ") + "12px " + getComputedStyle(document.body).fontFamily;
        ctx.fillStyle = "#f1f3f7";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(n.name, n.x, n.y + r + 4);
        ctx.restore();
      }
    });

    // 클릭 리플
    var now = performance.now();
    ripples = ripples.filter(function(rp){ return now - rp.start < RIPPLE_MS; });
    ripples.forEach(function(rp){
      var t = (now - rp.start) / RIPPLE_MS;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, 12 + t * 46, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = rp.color;
      ctx.stroke();
      ctx.restore();
    });
  }

  function loop(){
    tick();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------- 마우스 인터랙션 ----------------
  function nodeAt(px, py){
    var hit = null, hitDist = Infinity;
    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;
    pool.forEach(function(n){
      if (!n.visible) return;
      var dx = n.x - px, dy = n.y - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      var hitR = (n.animR != null ? n.animR : n.r) + 6;
      if (d < hitR && d < hitDist){ hit = n; hitDist = d; }
    });
    return hit;
  }

  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  var hoverTip = document.getElementById("hoverTip");

  canvas.addEventListener("mousedown", function(evt){
    var p = getPos(evt);
    downPos = p;
    dragMoved = false;
    var n = nodeAt(p.x, p.y);
    if (n && viewMode === "overview"){
      dragNode = n;
      dragPos.x = n.x; dragPos.y = n.y;
      canvas.classList.add("dragging");
      alpha = Math.max(alpha, 0.3);
    }
  });

  window.addEventListener("mousemove", function(evt){
    var p = getPos(evt);
    if (dragNode){
      dragPos = p;
      if (downPos && (Math.abs(p.x - downPos.x) > 3 || Math.abs(p.y - downPos.y) > 3)) dragMoved = true;
      hoverTip.classList.remove("show");
    } else {
      var rect = canvas.getBoundingClientRect();
      var inCanvas = evt.clientX >= rect.left && evt.clientX <= rect.right && evt.clientY >= rect.top && evt.clientY <= rect.bottom;
      var n = inCanvas ? nodeAt(p.x, p.y) : null;
      var newHover = n ? n.id : null;
      if (newHover !== hoverId){
        hoverId = newHover;
        canvas.style.cursor = n ? "pointer" : "grab";
      }
      if (n){
        hoverTip.style.left = p.x + "px";
        hoverTip.style.top = p.y + "px";
        var html = escapeHtml(n.name) + ' <span class="team">· ' + escapeHtml(n.team) + '</span>';
        if (viewMode === "ego" && n.id !== selectedId){
          var nb = egoNeighbors.filter(function(x){ return x.node.id === n.id; })[0];
          if (nb) html += '<span class="pct">' + Math.round(Math.max(nb.w, 0) * 100) + '%</span>';
        }
        hoverTip.innerHTML = html;
        hoverTip.classList.add("show");
      } else {
        hoverTip.classList.remove("show");
      }
    }
  });

  window.addEventListener("mouseup", function(evt){
    if (dragNode){
      var n = dragNode;
      dragNode = null;
      canvas.classList.remove("dragging");
      if (!dragMoved) enterEgo(n.id);
      alpha = Math.max(alpha, 0.15);
    } else {
      var p = getPos(evt);
      var rect = canvas.getBoundingClientRect();
      var inCanvas = evt.clientX >= rect.left && evt.clientX <= rect.right && evt.clientY >= rect.top && evt.clientY <= rect.bottom;
      var hit = inCanvas ? nodeAt(p.x, p.y) : null;
      if (hit){
        if (viewMode === "overview" || hit.id !== selectedId) enterEgo(hit.id);
      } else if (inCanvas){
        exitEgo();
      }
    }
    downPos = null;
  });

  window.addEventListener("keydown", function(evt){
    if (evt.key === "Escape") exitEgo();
  });

  // ---------------- 사이드 패널 (선택 인물 상세) ----------------
  var detailPanel = document.getElementById("detailPanel");
  var resetBtn = document.getElementById("resetBtn");
  resetBtn.addEventListener("click", exitEgo);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderDetail(){
    var n = byId[selectedId];
    if (!n){ detailPanel.classList.remove("visible"); return; }
    var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
    var neighbors = egoNeighbors;

    var html = "";
    html += '<div class="detail-name">' + escapeHtml(n.name) + "</div>";
    html += '<div class="detail-team" style="background:' + color + '22;color:' + color + '">';
    html += '<span class="dot" style="background:' + color + '"></span>' + escapeHtml(n.team) + "</div>";
    html += '<div class="tag-chips">' + (n.tags || []).map(function(t){
      return '<button class="tag-chip" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</button>';
    }).join("") + '</div>';
    html += '<div class="detail-flavor"><span class="label">근원경쟁력 회고 원문 (더미)</span>';
    html += '<div class="md-body">' + mdToHtml(n.text || "") + '</div></div>';
    html += '<div class="neighbor-label">유사도 상위 ' + neighbors.length + '명</div>';
    html += '<div class="neighbor-list">';
    neighbors.forEach(function(nb){
      var nc = TEAM_COLOR[nb.node.team] || DEFAULT_COLOR;
      var pct = Math.max(0, Math.min(1, nb.w)) * 100;
      html += '<button class="neighbor-item" data-id="' + nb.node.id + '">';
      html += '<span class="dot" style="background:' + nc + '"></span>';
      html += '<span class="n-name">' + escapeHtml(nb.node.name) + '</span>';
      html += '<span class="n-score">' + nb.w.toFixed(3) + '</span>';
      html += '<span class="n-bar-track"><span class="n-bar-fill" style="width:' + pct + '%;background:' + nc + '"></span></span>';
      html += '</button>';
    });
    html += '</div>';

    detailPanel.innerHTML = html;
    detailPanel.classList.add("visible");

    detailPanel.querySelectorAll(".neighbor-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        enterEgo(parseInt(btn.getAttribute("data-id"), 10));
      });
    });

    // 태그 칩 클릭 → 오버뷰로 나가 보유자만 점등 (팀 필터와 동일 dim UX)
    detailPanel.querySelectorAll(".tag-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        var t = chip.getAttribute("data-tag");
        exitEgo();
        setTagFilter(t === filterTag ? null : t);
      });
    });
  }

  // ---------------- 태그 필터 (006) ----------------
  var filterTag = null;
  var tagPill = document.getElementById("tagPill");
  function setTagFilter(tag){
    filterTag = tag;
    tagPill.innerHTML = tag ? '태그 <b>' + escapeHtml(tag) + "</b> 보유자만 점등 · ×" : "";
    tagPill.classList.toggle("visible", !!tag);
  }
  tagPill.addEventListener("click", function(){ setTagFilter(null); });

  // ---------------- 검색 (실시간 펄스 하이라이트 포함) ----------------
  var searchInput = document.getElementById("searchInput");
  var searchResults = document.getElementById("searchResults");
  var clearBtn = document.getElementById("clearBtn");

  function renderResults(query){
    searchResults.innerHTML = "";
    if (!query){ clearBtn.style.display = "none"; return; }
    clearBtn.style.display = "block";
    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;
    var matches = pool.filter(function(n){ return n.name.indexOf(query) !== -1; });
    var shown = matches.slice(0, 8);
    shown.forEach(function(n){
      var item = document.createElement("button");
      item.className = "result-item";
      var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
      item.innerHTML = '<span class="dot" style="background:' + color + '"></span>' +
        '<span>' + escapeHtml(n.name) + '</span>' +
        '<span class="team-name">' + escapeHtml(n.team) + '</span>';
      item.addEventListener("click", function(){
        enterEgo(n.id);
        searchInput.value = n.name;
        searchResults.innerHTML = "";
      });
      searchResults.appendChild(item);
    });
    if (matches.length > shown.length){
      var count = document.createElement("div");
      count.className = "search-count";
      count.textContent = "+" + (matches.length - shown.length) + "명 더 (검색어를 좁혀보세요)";
      searchResults.appendChild(count);
    }
  }

  searchInput.addEventListener("input", function(){ renderResults(searchInput.value.trim()); });
  searchInput.addEventListener("keydown", function(evt){
    if (evt.key === "Enter"){
      var first = searchResults.querySelector(".result-item");
      if (first) first.click();
    } else if (evt.key === "Escape") {
      searchInput.value = "";
      renderResults("");
      searchInput.blur();
    }
  });
  clearBtn.addEventListener("click", function(){
    searchInput.value = "";
    renderResults("");
    searchInput.focus();
  });

  // ---------------- 팀 범례: 클릭(dim) / 더블클릭(격리) ----------------
  var legend = document.getElementById("legend");
  var isolateClearBtn = document.getElementById("isolateClear");
  var teamCounts = {};
  nodes.forEach(function(n){ teamCounts[n.team] = (teamCounts[n.team] || 0) + 1; });

  var chipEls = {};
  Object.keys(TEAM_COLOR).forEach(function(team){
    var chip = document.createElement("button");
    chip.className = "team-chip";
    chip.innerHTML = '<span class="dot" style="background:' + TEAM_COLOR[team] + '"></span>' +
      '<span>' + escapeHtml(team) + '</span>' +
      '<span class="count">' + (teamCounts[team] || 0) + '</span>';

    var clickTimer = null;
    chip.addEventListener("click", function(){
      if (clickTimer) return;
      clickTimer = setTimeout(function(){
        clickTimer = null;
        if (isolateTeam) return; // 격리 중엔 단일 클릭 dim 토글 비활성화
        if (filterTeams[team]) delete filterTeams[team]; else filterTeams[team] = true;
        refreshChips();
      }, 230);
    });
    chip.addEventListener("dblclick", function(){
      if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
      isolateTeam = (isolateTeam === team) ? null : team;
      filterTeams = {};
      if (viewMode === "ego") exitEgo();
      rebuildEdges();
      recomputeMaxDegree();
      nodes.forEach(function(n){ n._placed = false; });
      alpha = 1;
      refreshChips();
    });

    legend.appendChild(chip);
    chipEls[team] = chip;
  });

  function refreshChips(){
    Object.keys(chipEls).forEach(function(team){
      var chip = chipEls[team];
      chip.classList.toggle("isolated", isolateTeam === team);
      chip.classList.toggle("dimmed-off", isFilterActive() && !filterTeams[team] && !isolateTeam);
    });
    isolateClearBtn.style.display = isolateTeam ? "inline" : "none";
  }
  isolateClearBtn.addEventListener("click", function(){
    isolateTeam = null;
    filterTeams = {};
    rebuildEdges();
    recomputeMaxDegree();
    nodes.forEach(function(n){ n._placed = false; });
    alpha = 1;
    refreshChips();
  });

  // ---------------- Top-N 슬라이더 (전체 뷰 전용) ----------------
  var topnSlider = document.getElementById("topnSlider");
  var topnValue = document.getElementById("topnValue");
  topnSlider.value = topN;
  topnValue.textContent = topN;
  topnSlider.addEventListener("input", function(){
    topN = parseInt(topnSlider.value, 10);
    topnValue.textContent = topN;
    rebuildEdges();
    recomputeMaxDegree();
    alpha = Math.max(alpha, 0.5);
  });

  // ---------------- 워드클라우드 (005) ----------------
  var cloudCanvas = document.getElementById("cloudCanvas");
  var cloudNote = document.getElementById("cloudNote");
  var cloudSelect = document.getElementById("cloudSelect");
  var cloudTabs = document.getElementById("cloudTabs");
  var cloudEgoTab = document.getElementById("cloudEgoTab");
  var cloudScope = "all";
  var CLOUD_TEAMS = Object.keys(TEAM_COLOR).sort();
  var CLOUD_CLS = (function(){
    var s = {};
    DATA.nodes.forEach(function(n){ s[n.cl_level] = true; });
    return Object.keys(s).sort();
  })();

  function egoIdList(){
    if (viewMode !== "ego") return null;
    return [selectedId].concat(egoNeighbors.map(function(nb){ return nb.node.id; }));
  }

  function renderCloud(){
    var ids = cloudScopeIds(cloudScope, cloudSelect.value, DATA.nodes, egoIdList());
    var state = cloudState(FREQ, ids);
    if (!state.ok){
      if (window.WordCloud) WordCloud.stop();
      cloudCanvas.getContext("2d").clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
      cloudNote.textContent = "표본 " + state.count + "명 — 5명 미만 집합은 표시하지 않습니다";
      return;
    }
    cloudNote.textContent = "상대 크기만 표시 · 절대 빈도는 공개하지 않습니다";
    WordCloud(cloudCanvas, {
      list: state.list,
      weightFactor: function(w){ return 15 + w * 55; }, // 상대 크기(0~1) → 캔버스 px
      gridSize: 10,
      rotateRatio: 0,
      backgroundColor: "transparent",
      color: function(){ return PALETTE[Math.floor(Math.random() * PALETTE.length)]; },
      shuffle: false,
      drawOutOfBound: false
    });
  }

  function setCloudScope(scope){
    cloudScope = scope;
    Array.prototype.forEach.call(cloudTabs.querySelectorAll("button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-scope") === scope);
    });
    if (scope === "team" || scope === "cl"){
      var opts = scope === "team" ? CLOUD_TEAMS : CLOUD_CLS;
      cloudSelect.innerHTML = opts.map(function(v){
        return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>";
      }).join("");
      cloudSelect.style.display = "block";
    } else {
      cloudSelect.style.display = "none";
    }
    renderCloud();
  }

  cloudTabs.addEventListener("click", function(evt){
    var btn = evt.target.closest("button");
    if (!btn || btn.disabled) return;
    setCloudScope(btn.getAttribute("data-scope"));
  });
  cloudSelect.addEventListener("change", renderCloud);

  // ---------------- 시작 ----------------
  resize();
  loop();
  setCloudScope("all");
  // #ego=<id> 딥링크: 데모 중 특정 인물 에고 뷰로 바로 진입 (헤드리스 검증 겸용)
  var egoHash = location.hash.match(/^#ego=(\d+)$/);
  if (egoHash && byId[parseInt(egoHash[1], 10)]) enterEgo(parseInt(egoHash[1], 10));
})();
</script>
