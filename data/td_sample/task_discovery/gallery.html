테스트·멀티사이트 효율화\", \"definition\": \"병렬 테스트 관련 과제와 역량을 묶는다.\", \"x\": -294.8, \"y\": 95.8, \"people\": 33, \"pjt_spread\": 1, \"cl_spread\": 3, \"have\": 0, \"gap\": 18, \"readiness\": \"갭만 있음\", \"stars\": 59, \"sparse\": true}, {\"name\": \"설비 운영·자동화 표준화\", \"definition\": \"설비 관련 과제와 역량을 묶는다.\", \"x\": -294.8, \"y\": -95.8, \"people\": 34, \"pjt_spread\": 3, \"cl_spread\": 3, \"have\": 26, \"gap\": 3, \"readiness\": \"이미 함\", \"stars\": 43, \"sparse\": false}, {\"name\": \"양산 Yield 안정화\", \"definition\": \"Yield 관련 과제와 역량을 묶는다.\", \"x\": -182.2, \"y\": -250.8, \"people\": 17, \"pjt_spread\": 1, \"cl_spread\": 2, \"have\": 0, \"gap\": 6, \"readiness\": \"갭만 있음\", \"stars\": 21, \"sparse\": true}], \"sources\": {\"1\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 데이터(STDF) 통합 관리 체계에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 데이터(STDF) 통합 관리 체계 체계를 만들고 싶다. 장기적으로는 설비 운영 지표 표준화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"2\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"3\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"4\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"5\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"6\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"7\": \"올해는 Teradyne 플랫폼 멀티사이트 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 테스트 타임 단축을 위한 PGM 구조 최적화도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"8\": \"앞으로의 방향\\n설비 운영 지표 표준화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 D1b 신제품 램프업 기획 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"9\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"10\": \"앞으로의 방향\\nDPPM 품질 개선을 위한 선제 진단을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"11\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"12\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"13\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"14\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"15\": \"앞으로의 방향\\nMagnum 테스터 Para 병렬 테스트 효율화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"16\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 설비 자동화 제어도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 ATE 스크립팅를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"17\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"18\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"19\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"20\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"21\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"22\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 설비 운영 지표 표준화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"23\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"24\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"25\": \"앞으로의 방향\\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 STDF 기반 고장분석(FA) 자동화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"26\": \"올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"27\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"28\": \"앞으로의 방향\\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"29\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"30\": \"앞으로의 방향\\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"31\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"32\": \"올해는 AX(AI Transformation) 기반 테스트 데이터 분석 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 설비 운영 지표 표준화를 해보고 싶은데 D1b 신제품 램프업 기획도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"33\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"34\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"35\": \"올해는 D1b 신제품 램프업 기획 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 데이터(STDF) 통합 관리 체계를 해보고 싶은데 AX(AI Transformation) 기반 테스트 데이터 분석도 관심이 있습니다. 그동안 배운 STDF 파싱 자동화를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"36\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"37\": \"올해는 신제품 D1b 초기 양산 Yield 안정화 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 타임 단축을 위한 PGM 구조 최적화를 해보고 싶은데 양산 Yield 저하 원인 분석·개선도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"38\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"39\": \"앞으로의 방향\\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) 설비 자동화 제어 역량을 확보해 왔다. 단기적으로는 DPPM 품질 개선을 위한 선제 진단 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"40\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"41\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"42\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"43\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"44\": \"앞으로의 방향\\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"45\": \"올해는 MBT(Monitoring Burn-in Test) 신뢰성 강화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 HFT(High-temp Final Test) 커버리지 확대도 관심이 있습니다. 그동안 배운 파이썬 데이터 분석를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"46\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"47\": \"앞으로의 방향\\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"48\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"49\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"50\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"51\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"52\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 AX(AI Transformation) 기반 테스트 데이터 분석에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"53\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"54\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"55\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"56\": \"앞으로의 방향\\nTeradyne 플랫폼 멀티사이트 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"57\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"58\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"59\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"60\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 데이터(STDF) 통합 관리 체계에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 데이터(STDF) 통합 관리 체계 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"61\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"62\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Magnum 테스터 Para 병렬 테스트 효율화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"63\": \"올해는 Advantest V93000 Test PGM 디버깅 시간 단축 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 타임 단축을 위한 PGM 구조 최적화를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"64\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"65\": \"올해는 테스트 타임 단축을 위한 PGM 구조 최적화 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 신제품 D1b 초기 양산 Yield 안정화를 해보고 싶은데 Advantest V93000 Test PGM 디버깅 시간 단축도 관심이 있습니다. 그동안 배운 파이썬 데이터 분석를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"66\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"67\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"68\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"69\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 BIB(Burn-in Board) 설계·수명 관리까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"70\": \"앞으로의 방향\\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 머신러닝 이상탐지 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"71\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"72\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"73\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"74\": \"올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 머신러닝 이상탐지를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"75\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"76\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"77\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"78\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"79\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"80\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"81\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"82\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"83\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"84\": \"앞으로의 방향\\nBIB(Burn-in Board) 설계·수명 관리을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"85\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"86\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"87\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"88\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"89\": \"앞으로의 방향\\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 STDF 파싱 자동화와(과) 파이썬 데이터 분석 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"90\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"91\": \"올해는 STDF 기반 고장분석(FA) 자동화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"92\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"93\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"94\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"95\": \"1. 상반기 성과 및 하 const wrap = document.getElementById("frameWrap");
const bar = document.getElementById("bar");
const frames = {};

GALLERY.views.forEach(function(v){
  var tab = document.createElement("button");
  tab.className = "tab"; tab.id = "tab-" + v.id;
  tab.innerHTML = v.title + '<span class="n">' + v.desc + '</span>';
  tab.title = v.desc;
  tab.onclick = function(){ selectView(v.id); };
  bar.appendChild(tab);

  var frame = document.createElement("iframe");
  frame.id = "frame-" + v.id;
  wrap.appendChild(frame);
  frames[v.id] = frame;
});

if (GALLERY.tour && GALLERY.tour.length){
  var tourBtn = document.createElement("button");
  tourBtn.className = "tour-btn";
  tourBtn.textContent = "▶ 항해";
  tourBtn.onclick = function(){ startTour(0); };
  bar.appendChild(tourBtn);
}

var loaded = {}, ready = {};

// hash가 필요한 장면(예: mode=ax)은 iframe이 로드된 뒤에야 그 안의 딥링크를 적용할 수 있다 —
// 기존 은하수/성좌 지도의 #ego=·#mode= 관례를 그대로 타는 것뿐, 새 프로토콜을 만들지 않았다.
function openView(id, innerHash){
  GALLERY.views.forEach(function(v){
    document.getElementById("tab-" + v.id).classList.toggle("on", v.id === id);
    frames[v.id].classList.toggle("on", v.id === id);
  });
  var frame = frames[id];
  function applyHash(){ if (innerHash) frame.contentWindow.location.hash = innerHash; }
  if (ready[id]){
    applyHash();
  } else {
    frame.addEventListener("load", function once(){
      frame.removeEventListener("load", once);
      ready[id] = true;
      applyHash();
    });
    if (!loaded[id]){ frame.srcdoc = GALLERY.html[id]; loaded[id] = true; }
  }
  history.replaceState(null, "", "#view=" + id);
}
function selectView(id){ openView(id, null); }

// ---------------- 항해(#021) — 장면 순서를 코드에 박아 발표자가 키 하나로 넘긴다 ----------------
var tourChrome = document.getElementById("tourChrome");
var tourCaption = document.getElementById("tourCaption");
var tourDots = document.getElementById("tourDots");
var scene = -1;   // -1 = 항해 모드 아님

function renderTourChrome(){
  var scenes = GALLERY.tour;
  tourCaption.textContent = scenes[scene].caption;
  tourDots.innerHTML = scenes.map(function(_, i){
    return '<span class="' + (i === scene ? "on" : "") + '"></span>';
  }).join("");
  document.getElementById("tourPrev").disabled = scene === 0;
  document.getElementById("tourNext").disabled = scene === scenes.length - 1;
}
function gotoScene(i){
  var scenes = GALLERY.tour;
  scene = Math.max(0, Math.min(scenes.length - 1, i));
  openView(scenes[scene].view, scenes[scene].hash);
  renderTourChrome();
}
function startTour(i){ tourChrome.classList.add("on"); gotoScene(i); }
function exitTour(){ scene = -1; tourChrome.classList.remove("on"); }

document.getElementById("tourPrev").onclick = function(){ gotoScene(scene - 1); };
document.getElementById("tourNext").onclick = function(){ gotoScene(scene + 1); };
document.getElementById("tourExit").onclick = exitTour;
document.addEventListener("keydown", function(e){
  if (scene < 0) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); gotoScene(scene + 1); }
  else if (e.key === "ArrowLeft") gotoScene(scene - 1);
  else if (e.key === "Escape") exitTour();
});

var initial = (location.hash.match(/view=([a-z]+)/) || [])[1];
var tourStart = (location.hash.match(/tour=(\d+)/) || [])[1];   // #tour=<n> — 특정 장면부터, 검증·직접 링크용
if (tourStart != null && GALLERY.tour[Number(tourStart)]) startTour(Number(tourStart));
else selectView(GALLERY.html[initial] ? initial : GALLERY.views[0].id);
</script>
</body>
</html>
