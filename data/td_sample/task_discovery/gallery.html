<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>task-discovery — 산출물 갤러리</title>
<style>
  :root{ --bg:#faf8f4; --ink:#211e1a; --dim:#7a7468; --line:#e7e2d8; --amber:#a6650f; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
             font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; }
  .shell{ height:100%; display:flex; flex-direction:column; }
  .bar{ display:flex; align-items:center; gap:2px; padding:0 16px; border-bottom:1px solid var(--line);
        flex:none; background:#fff; overflow-x:auto; }
  .brand{ font-family:Georgia,"Noto Serif KR",serif; font-size:15px; font-weight:600; padding:14px 16px 14px 0;
          white-space:nowrap; border-right:1px solid var(--line); margin-right:6px; }
  .tab{ appearance:none; background:none; border:none; padding:13px 16px; font-size:13px; font-weight:600;
        color:var(--dim); cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
        font-family:inherit; }
  .tab:hover{ color:var(--ink); }
  .tab.on{ color:var(--ink); border-bottom-color:var(--amber); }
  .tab .n{ display:block; font-size:10px; font-weight:500; color:var(--dim); margin-top:1px; }
  .tab.on .n{ color:#a08a5c; }
  .tour-btn{ appearance:none; margin-left:auto; background:var(--amber); color:#fff; border:none;
             border-radius:100px; padding:8px 16px; font-size:12.5px; font-weight:600; cursor:pointer;
             white-space:nowrap; font-family:inherit; }
  .tour-btn:hover{ background:#8f5609; }
  .frame-wrap{ flex:1; min-height:0; position:relative; background:#fff; }
  iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:none; }
  iframe.on{ display:block; }

  /* ---- 항해(발표 모드) ---- */
  .tour-chrome{ position:fixed; inset:0; z-index:50; pointer-events:none; display:none; }
  .tour-chrome.on{ display:block; }
  .tour-caption{ position:absolute; left:50%; bottom:32px; transform:translateX(-50%);
                 max-width:min(720px,86vw); background:rgba(20,17,12,0.92); color:#faf8f4;
                 border-radius:12px; padding:16px 22px; font-size:15px; line-height:1.6;
                 text-align:center; pointer-events:auto; box-shadow:0 12px 34px rgba(0,0,0,0.28); }
  .tour-dots{ display:flex; gap:6px; justify-content:center; margin-top:11px; }
  .tour-dots span{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.28); }
  .tour-dots span.on{ background:var(--amber); }
  .tour-nav{ position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px;
             border-radius:50%; border:none; background:rgba(20,17,12,0.55); color:#fff; font-size:18px;
             cursor:pointer; pointer-events:auto; }
  .tour-nav:hover{ background:rgba(20,17,12,0.8); }
  .tour-nav.prev{ left:20px; } .tour-nav.next{ right:20px; }
  .tour-nav[disabled]{ opacity:0.25; cursor:default; }
  .tour-exit{ position:absolute; top:20px; right:24px; background:rgba(20,17,12,0.55); color:#fff;
              border:none; border-radius:100px; padding:7px 14px; font-size:12px; cursor:pointer;
              pointer-events:auto; }
  .tour-exit:hover{ background:rgba(20,17,12,0.8); }
</style>
</head>
<body>
<div class="shell">
  <div class="bar" id="bar">
    <div class="brand">task-discovery 갤러리</div>
  </div>
  <div class="frame-wrap" id="frameWrap"></div>
</div>
<div class="tour-chrome" id="tourChrome">
  <button class="tour-nav prev" id="tourPrev">‹</button>
  <button class="tour-nav next" id="tourNext">›</button>
  <button class="tour-exit" id="tourExit">항해 종료 (Esc)</button>
  <div class="tour-caption">
    <div id="tourCaption"></div>
    <div class="tour-dots" id="tourDots"></div>
  </div>
</div>
<script>
const GALLERY = {"views": [{"id": "constellation", "title": "성좌 지도", "desc": "별=과제 · 카테고리별 성좌 · 빈 하늘 · AX 렌즈 · 계보"}, {"id": "heatmap", "title": "부서 단면", "desc": "팀 × 카테고리 배정 건수"}, {"id": "questions", "title": "질문 카드", "desc": "집계에서 뽑은 워크숍 아젠다"}, {"id": "onepager", "title": "임원 한 장", "desc": "수치 셋 + 미니 성좌, 스크롤 없음"}, {"id": "consensus", "title": "합의의 무게", "desc": "워크숍 투표가 별에 고리로"}], "html": {"constellation": "\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003e성좌 지도 — 무엇을 말했나\u003c/title\u003e\n\u003cstyle\u003e\n  :root { --bg:#070912; --ink:#e8ecf8; --dim:#5b6480; --line:#1b2136; --gold:#f0c674; --teal:#5ad2c4; }\n  * { box-sizing:border-box; }\n  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;\n         font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Segoe UI\",sans-serif; }\n  canvas { display:block; cursor:crosshair; }\n  .panel { position:fixed; background:rgba(10,13,25,.93); border:1px solid var(--line);\n           border-radius:8px; backdrop-filter:blur(8px); }\n  #hud { top:16px; left:16px; padding:14px 16px; max-width:340px; }\n  h1 { margin:0 0 4px; font-size:15px; letter-spacing:.02em; font-weight:600; }\n  .sub { font-size:11px; color:var(--dim); line-height:1.6; }\n  .modes { margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; }\n  button { background:#141a2e; color:var(--ink); border:1px solid var(--line); border-radius:5px;\n           padding:6px 10px; font-size:11px; cursor:pointer; font-family:inherit; }\n  button.on { background:var(--gold); color:#12151f; border-color:var(--gold); font-weight:600; }\n  button:hover:not(.on) { border-color:var(--dim); }\n  #note { margin-top:10px; font-size:11px; line-height:1.6; padding:8px 10px; border-radius:5px;\n          display:none; }\n  #note.show { display:block; }\n  .warn { background:rgba(240,198,116,.1); border:1px solid rgba(240,198,116,.35); color:#f5d99a; }\n  #legend { bottom:16px; left:16px; padding:12px 14px; font-size:11px; color:var(--dim); line-height:1.9; }\n  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }\n  #detail { top:16px; right:16px; width:390px; max-height:calc(100vh - 32px); overflow-y:auto;\n            padding:16px 18px; display:none; }\n  #detail.show { display:block; }\n  .lbl { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);\n         margin:14px 0 5px; }\n  .lbl:first-child { margin-top:0; }\n  .chain { border-left:2px solid var(--line); padding-left:12px; margin-left:3px; }\n  .chain .step { margin-bottom:12px; font-size:12.5px; line-height:1.65; }\n  .src { font-size:11.5px; line-height:1.75; color:#aab3cc; max-height:190px; overflow-y:auto;\n         white-space:pre-wrap; background:#0b0f1c; padding:10px; border-radius:5px; }\n  mark { background:rgba(240,198,116,.28); color:#fbe6b4; border-radius:2px; padding:0 2px; }\n  .tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:99px;\n         border:1px solid var(--line); color:var(--dim); margin:0 4px 4px 0; }\n  .tag.ax { border-color:var(--teal); color:var(--teal); }\n  .close { float:right; background:none; border:none; color:var(--dim); font-size:16px; padding:0 4px; }\n  #tip { position:fixed; pointer-events:none; background:rgba(8,11,20,.95); border:1px solid var(--line);\n         padding:7px 10px; border-radius:5px; font-size:11.5px; display:none; max-width:290px; line-height:1.5; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003ccanvas id=\"sky\"\u003e\u003c/canvas\u003e\n\n\u003cdiv id=\"hud\" class=\"panel\"\u003e\n  \u003ch1\u003e성좌 지도\u003c/h1\u003e\n  \u003cdiv class=\"sub\"\u003e별 하나 = 과제 하나. 같은 카테고리가 한 별자리.\u003cbr\u003e\n    크기 = 확산도(몇 조직이 말했나) · 위치는 결정적이라 매번 같다.\u003c/div\u003e\n  \u003cdiv class=\"modes\"\u003e\n    \u003cbutton id=\"m-front\" class=\"on\"\u003e성좌\u003c/button\u003e\n    \u003cbutton id=\"m-empty\"\u003e빈 하늘\u003c/button\u003e\n    \u003cbutton id=\"m-ax\"\u003eAX 렌즈\u003c/button\u003e\n  \u003c/div\u003e\n  \u003cdiv id=\"note\" class=\"warn\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv id=\"legend\" class=\"panel\"\u003e\n  \u003cdiv\u003e\u003cspan class=\"sw\" style=\"background:#e8ecf8\"\u003e\u003c/span\u003e과제 (별)\u003c/div\u003e\n  \u003cdiv\u003e\u003cspan class=\"sw\" style=\"background:#5ad2c4\"\u003e\u003c/span\u003eAX를 \u003cb\u003e언급한\u003c/b\u003e 과제 — 판정 아님\u003c/div\u003e\n  \u003cdiv\u003e\u003cspan class=\"sw\" style=\"background:#f0c674\"\u003e\u003c/span\u003e희박한 영역 (한 조직만 / 갭만 있음)\u003c/div\u003e\n  \u003cdiv style=\"margin-top:6px;color:#39405a\"\u003e별을 클릭하면 원문까지의 계보가 열린다\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv id=\"detail\" class=\"panel\"\u003e\u003c/div\u003e\n\u003cdiv id=\"tip\"\u003e\u003c/div\u003e\n\n\u003cscript\u003e\nconst DATA = {\"stars\": [{\"id\": \"1:future_task:0\", \"cat\": \"D1b 신제품 램프업\", \"axis\": \"future_task\", \"text\": \"D1b 신제품 램프업 기획 과제를 추진하려 한다\", \"quote\": \"D1b 신제품\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": \"단기\", \"ax\": false, \"x\": 306.9, \"y\": -50.6, \"consensus\": null}, {\"id\": \"1:future_task:1\", \"cat\": \"AX 기반 테스트 데이터 분석\", \"axis\": \"future_task\", \"text\": \"테스트 데이터(STDF) 통합 관리 체계 과제를 추진하려 한다\", \"quote\": \"테스트 데이터\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": \"장기\", \"ax\": false, \"x\": 48.7, \"y\": -376.9, \"consensus\": null}, {\"id\": \"1:capability_gap:0\", \"cat\": \"설비 운영·자동화 표준화\", \"axis\": \"capability_gap\", \"text\": \"설비 운영 지표 표준화 수행에 필요한 역량이 아직 부족하다\", \"quote\": \"설비\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": null, \"ax\": false, \"x\": -286.4, \"y\": -81.0, \"consensus\": null}, {\"id\": \"1:capability_have:0\", \"cat\": \"AX 기반 테스트 데이터 분석\", \"axis\": \"capability_have\", \"text\": \"머신러닝 이상탐지 역량을 실무에 적용해 왔다\", \"quote\": \"머신러닝\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": null, \"ax\": false, \"x\": 70.5, \"y\": -288.7, \"consensus\": null}, {\"id\": \"1:capability_have:1\", \"cat\": \"STDF 기반 고장분석 자동화\", \"axis\": \"capability_have\", \"text\": \"STDF 파싱 자동화 역량을 실무에 적용해 왔다\", \"quote\": \"STDF 파싱\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": null, \"ax\": false, \"x\": 242.2, \"y\": 257.7, \"consensus\": null}, {\"id\": \"1:direction:0\", \"cat\": \"D1b 신제품 램프업\", \"axis\": \"direction\", \"text\": \"D1b 신제품 램프업 기획 방향으로 팀 표준을 만들고 싶다\", \"quote\": \"D1b 신제품\", \"person\": \"안지호\", \"pid\": \"1\", \"pjt\": \"기획운영\", \"cl\": \"CL2\", \"horizon\": null, \"ax\": false, \"x\": 234.8, \"y\": -192.2, \"consensus\": null}, {\"id\": \"2:future_task:0\", \"cat\": \"D1b 신제품 램프업\", \"axis\": \"future_task\", \"text\": \"신제품 D1b 초기 양산 Yield 안정화 과제를 추진하려 한다\", \"quote\": \"D1b 초기\", \"person\": \"박주원\", \"pid\": \"2\", \"pjt\": \"양산기술\", \"cl\": \"CL3\", \"horizon\": \"단기\", \"ax\": false, \"x\": 268.1, \"y\": -142.2, \"consensus\": null}, {\"id\": \"2:future_task:1\", \"cat\": \"병렬 테스트·멀티사이트 효율화\", \"axis\": \"future_task\", \"text\": \"Teradyne 플랫폼 멀티사이트 확대 과제를 추진하려 한다\", \"quote\": \"멀티사이트\", \"person\": \"박주원\", \"pid\": \"2\", \"pjt\": \"양산기술\", \"cl\": \"CL3\", \"horizon\": \"장기\", \"ax\": false, \"x\": -317.0, \"y\": 102.5, \"consensus\": null}, {\"id\": \"2:capability_gap:0\", \"cat\": \"병렬 테스트·멀티사이트 효율화\", \"axis\": \"capability_gap\", \"text\": \"Magnum 테스터 Para 병렬 테스트 효율화 수행에 필요한 역량이 아직 부족하다\", \"quote\": \"병렬 테스트\", \"person\": \"박주원\", \"pid\": \"2\", \"pjt\": \"양산기술\", \"cl\": \"CL3\", \"horizon\": null, \"ax\": false, \"x\": -345.1, \"y\": 44.7, \"consensus\": null}, {\"id\": \"2:capability_have:0\", \"cat\": \"Test PGM 디버깅·구조 최적화\", \"axis\": \"capability_have\", \"text\": \"ATE 스크립팅 역량을 실무에 적용해 왔다\" read\": 3, \"have\": 0, \"gap\": 18, \"readiness\": \"갭만 있음\", \"stars\": 59, \"sparse\": true}, {\"name\": \"설비 운영·자동화 표준화\", \"definition\": \"설비 관련 과제와 역량을 묶는다.\", \"x\": -294.8, \"y\": -95.8, \"people\": 34, \"pjt_spread\": 3, \"cl_spread\": 3, \"have\": 26, \"gap\": 3, \"readiness\": \"이미 함\", \"stars\": 43, \"sparse\": false}, {\"name\": \"양산 Yield 안정화\", \"definition\": \"Yield 관련 과제와 역량을 묶는다.\", \"x\": -182.2, \"y\": -250.8, \"people\": 17, \"pjt_spread\": 1, \"cl_spread\": 2, \"have\": 0, \"gap\": 6, \"readiness\": \"갭만 있음\", \"stars\": 21, \"sparse\": true}], \"sources\": {\"1\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 데이터(STDF) 통합 관리 체계에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 데이터(STDF) 통합 관리 체계 체계를 만들고 싶다. 장기적으로는 설비 운영 지표 표준화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"2\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"3\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"4\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"5\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"6\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"7\": \"올해는 Teradyne 플랫폼 멀티사이트 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 테스트 타임 단축을 위한 PGM 구조 최적화도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"8\": \"앞으로의 방향\\n설비 운영 지표 표준화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 D1b 신제품 램프업 기획 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"9\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"10\": \"앞으로의 방향\\nDPPM 품질 개선을 위한 선제 진단을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"11\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"12\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"13\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"14\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"15\": \"앞으로의 방향\\nMagnum 테스터 Para 병렬 테스트 효율화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"16\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 설비 자동화 제어도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 ATE 스크립팅를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"17\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"18\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"19\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"20\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"21\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"22\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 설비 운영 지표 표준화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"23\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"24\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"25\": \"앞으로의 방향\\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 STDF 기반 고장분석(FA) 자동화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"26\": \"올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"27\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"28\": \"앞으로의 방향\\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"29\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"30\": \"앞으로의 방향\\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"31\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"32\": \"올해는 AX(AI Transformation) 기반 테스트 데이터 분석 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 설비 운영 지표 표준화를 해보고 싶은데 D1b 신제품 램프업 기획도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"33\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"34\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"35\": \"올해는 D1b 신제품 램프업 기획 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 데이터(STDF) 통합 관리 체계를 해보고 싶은데 AX(AI Transformation) 기반 테스트 데이터 분석도 관심이 있습니다. 그동안 배운 STDF 파싱 자동화를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"36\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"37\": \"올해는 신제품 D1b 초기 양산 Yield 안정화 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 타임 단축을 위한 PGM 구조 최적화를 해보고 싶은데 양산 Yield 저하 원인 분석·개선도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"38\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"39\": \"앞으로의 방향\\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) 설비 자동화 제어 역량을 확보해 왔다. 단기적으로는 DPPM 품질 개선을 위한 선제 진단 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"40\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"41\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"42\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"43\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"44\": \"앞으로의 방향\\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"45\": \"올해는 MBT(Monitoring Burn-in Test) 신뢰성 강화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 HFT(High-temp Final Test) 커버리지 확대도 관심이 있습니다. 그동안 배운 파이썬 데이터 분석를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"46\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"47\": \"앞으로의 방향\\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"48\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"49\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"50\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"51\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"52\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 AX(AI Transformation) 기반 테스트 데이터 분석에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"53\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"54\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"55\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"56\": \"앞으로의 방향\\nTeradyne 플랫폼 멀티사이트 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"57\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"58\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"59\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"60\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 데이터(STDF) 통합 관리 체계에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 데이터(STDF) 통합 관리 체계 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"61\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"62\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Magnum 테스터 Para 병렬 테스트 효율화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"63\": \"올해는 Advantest V93000 Test PGM 디버깅 시간 단축 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 타임 단축을 위한 PGM 구조 최적화를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"64\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"65\": \"올해는 테스트 타임 단축을 위한 PGM 구조 최적화 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 신제품 D1b 초기 양산 Yield 안정화를 해보고 싶은데 Advantest V93000 Test PGM 디버깅 시간 단축도 관심이 있습니다. 그동안 배운 파이썬 데이터 분석를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"66\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"67\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"68\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"69\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 BIB(Burn-in Board) 설계·수명 관리까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"70\": \"앞으로의 방향\\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 머신러닝 이상탐지 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"71\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"72\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"73\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"74\": \"올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 머신러닝 이상탐지를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"75\": \"올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"76\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"77\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"78\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"79\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"80\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"81\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"82\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"83\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"84\": \"앞으로의 방향\\nBIB(Burn-in Board) 설계·수명 관리을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"85\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"86\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"87\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"88\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"89\": \"앞으로의 방향\\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 STDF 파싱 자동화와(과) 파이썬 데이터 분석 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"90\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"91\": \"올해는 STDF 기반 고장분석(FA) 자동화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"92\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"93\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"94\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"95\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"96\": \"올해는 Advantest V93000 Test PGM 디버깅 시간 단축 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 Teradyne 플랫폼 멀티사이트 확대를 해보고 싶은데 Magnum 테스터 Para 병렬 테스트 효율화도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"97\": \"올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. 통계적 공정관리(SPC)도 익혔고요. 앞으로 Teradyne 플랫폼 멀티사이트 확대를 해보고 싶은데 Advantest V93000 Test PGM 디버깅 시간 단축도 관심이 있습니다. 그동안 배운 STDF 파싱 자동화를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"98\": \"앞으로의 방향\\nD1b 신제품 램프업 기획을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) 머신러닝 이상탐지 역량을 확보해 왔다. 단기적으로는 설비 운영 지표 표준화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.\", \"99\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"100\": \"그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.\", \"101\": \"올해는 AX(AI Transformation) 기반 테스트 데이터 분석 관련 일을 많이 했습니다. 설비 자동화 제어도 익혔고요. 앞으로 D1b 신제품 램프업 기획를 해보고 싶은데 설비 운영 지표 표준화도 관심이 있습니다. 그동안 배운 머신러닝 이상탐지를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"102\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"103\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.\", \"118\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"119\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\", \"120\": \"1. 상반기 성과 및 하반기 전략\\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\\n2. 커리어 회고 및 확보 역량\\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\\n3. 미래 업무\\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.\"}, \"anonymize\": false, \"totals\": {\"stars\": 595, \"cats\": 10, \"ax\": 5, \"sparse\": 5}};\nconst cv = document.getElementById(\"sky\"), cx = cv.getContext(\"2d\");\nlet W, H, mode = \"front\", sel = null, hover = null;\nlet view = { x: 0, y: 0, k: 1 };\n\nfunction resize() {\n  W = cv.width = innerWidth * devicePixelRatio;\n  H = cv.height = innerHeight * devicePixelRatio;\n  cv.style.width = innerWidth + \"px\"; cv.style.height = innerHeight + \"px\";\n  draw();\n}\naddEventListener(\"resize\", resize);\n\n// 확산도 → 반지름. 조직 수가 1~3이라 폭이 좁으니 별 개수도 섞어 시각 대비를 준다.\nconst catByName = Object.fromEntries(DATA.cats.map(c =\u003e [c.name, c]));\nfunction radius(s) {\n  const c = catByName[s.cat] || {};\n  return 1.6 + (c.pjt_spread || 1) * 0.9 + Math.min((c.cl_spread || 1), 3) * 0.35;\n}\nfunction toScreen(p) {\n  return [W / 2 + (p.x + view.x) * view.k * devicePixelRatio,\n          H / 2 + (p.y + view.y) * view.k * devicePixelRatio];\n}\n\nfunction starVisible(s) {\n  if (mode === \"ax\") return s.ax;\n  if (mode === \"empty\") return (catByName[s.cat] || {}).sparse;\n  return true;\n}\n\nfunction draw() {\n  cx.fillStyle = \"#070912\"; cx.fillRect(0, 0, W, H);\n\n  // 별자리 선 — 같은 카테고리 별들을 앵커에 잇는다(성좌의 뼈대)\n  for (const c of DATA.cats) {\n    const dimmed = (mode === \"empty\" \u0026\u0026 !c.sparse) || mode === \"ax\";\n    cx.strokeStyle = dimmed ? \"rgba(27,33,54,.35)\" : \"rgba(70,82,120,.30)\";\n    cx.lineWidth = devicePixelRatio * 0.6;\n    const [ax, ay] = toScreen(c);\n    for (const s of DATA.stars) {\n      if (s.cat !== c.name) continue;\n      const [sx, sy] = toScreen(s);\n      cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(sx, sy); cx.stroke();\n    }\n  }\n\n  // 희박 영역 표시 (빈 하늘)\n  if (mode === \"empty\") {\n    for (const c of DATA.cats) {\n      if (!c.sparse) continue;\n      const [x, y] = toScreen(c);\n      cx.strokeStyle = \"rgba(240,198,116,.6)\"; cx.lineWidth = devicePixelRatio * 1.3;\n      cx.setLineDash([6 * devicePixelRatio, 5 * devicePixelRatio]);\n      cx.beginPath(); cx.arc(x, y, 135 * view.k * devicePixelRatio, 0, 7); cx.stroke();\n      cx.setLineDash([]);\n    }\n  }\n\n  for (const s of DATA.stars) {\n    const [x, y] = toScreen(s);\n    const on = starVisible(s), r = radius(s) * view.k * devicePixelRatio;\n    if (on \u0026\u0026 s.ax) { cx.fillStyle = \"#5ad2c4\"; }\n    else if (on \u0026\u0026 mode === \"empty\") { cx.fillStyle = \"#f0c674\"; }\n    else if (on) { cx.fillStyle = \"#e8ecf8\"; }\n    else { cx.fillStyle = \"rgba(91,100,128,.22)\"; }\n    if (on \u0026\u0026 (mode === \"ax\" || mode === \"empty\")) {\n      cx.shadowColor = cx.fillStyle; cx.shadowBlur = 9 * devicePixelRatio;\n    }\n    cx.beginPath(); cx.arc(x, y, sel \u0026\u0026 sel.id === s.id ? r * 2.1 : r, 0, 7); cx.fill();\n    cx.shadowBlur = 0;\n    if (sel \u0026\u0026 sel.id === s.id) {\n      cx.strokeStyle = \"#f0c674\"; cx.lineWidth = devicePixelRatio * 1.5;\n      cx.beginPath(); cx.arc(x, y, r * 3.4, 0, 7); cx.stroke();\n    }\n  }\n\n  // 카테고리 이름\n  cx.textAlign = \"center\";\n  for (const c of DATA.cats) {\n    const [x, y] = toScreen(c);\n    const faded = (mode === \"empty\" \u0026\u0026 !c.sparse) || (mode === \"ax\");\n    cx.fillStyle = faded ? \"#39405a\" : (mode === \"empty\" \u0026\u0026 c.sparse ? \"#f0c674\" : \"#8b95b4\");\n    cx.font = `${11.5 * devicePixelRatio}px -apple-system, sans-serif`;\n    cx.fillText(c.name, x, y - 148 * view.k * devicePixelRatio);\n    cx.fillStyle = \"#39405a\";\n    cx.font = `${9.5 * devicePixelRatio}px ui-monospace, monospace`;\n    cx.fillText(`${c.stars}과제 · ${c.people}명 · ${c.pjt_spread}조직`,\n                x, y - 134 * view.k * devicePixelRatio);\n  }\n}\n\nfunction hit(mx, my) {\n  let best = null, bd = 16;\n  for (const s of DATA.stars) {\n    if (!starVisible(s)) continue;\n    const [x, y] = toScreen(s);\n    const d = Math.hypot(x / devicePixelRatio - mx, y / devicePixelRatio - my);\n    if (d \u003c bd) { bd = d; best = s; }\n  }\n  return best;\n}\n\nconst AXIS_KO = { future_task: \"미래 과제\", capability_have: \"보유 역량\",\n                  capability_gap: \"역량 갭\", direction: \"지향 방향\" };\n\nfunction esc(t) { return (t || \"\").replace(/[\u0026\u003c\u003e]/g, m =\u003e ({ \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\" }[m])); }\n\nfunction openDetail(s) {\n  sel = s;\n  const c = catByName[s.cat] || {};\n  const raw = DATA.sources[s.pid] || \"\";\n  let src = esc(raw);\n  if (raw \u0026\u0026 s.quote) {                     // 인용 구간을 원문 안에서 강조 (#015)\n    const i = raw.indexOf(s.quote);\n    if (i \u003e= 0) src = esc(raw.slice(0, i)) + \"\u003cmark\u003e\" + esc(s.quote) + \"\u003c/mark\u003e\" + esc(raw.slice(i + s.quote.length));\n  }\n  const d = document.getElementById(\"detail\");\n  d.innerHTML = `\n    \u003cbutton class=\"close\" onclick=\"closeDetail()\"\u003e×\u003c/button\u003e\n    \u003cdiv class=\"lbl\"\u003e계보 — 이 별은 어느 문장에서 왔나\u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cspan class=\"tag\"\u003e${esc(AXIS_KO[s.axis] || s.axis)}\u003c/span\u003e\n      ${s.horizon ? `\u003cspan class=\"tag\"\u003e${esc(s.horizon)}\u003c/span\u003e` : \"\"}\n      ${s.ax ? `\u003cspan class=\"tag ax\"\u003eAX를 언급함\u003c/span\u003e` : \"\"}\n      \u003cspan class=\"tag\"\u003e${esc(s.pjt || \"\")} · ${esc(s.cl || \"\")}\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"lbl\"\u003e① 회고 원문 ${s.person ? \"— \" + esc(s.person) : \"\"}\u003c/div\u003e\n    \u003cdiv class=\"src\"\u003e${src || \"\u003ci style='color:#39405a'\u003e원문 없음 (익명 모드)\u003c/i\u003e\"}\u003c/div\u003e\n    \u003cdiv class=\"lbl\"\u003e② 인용 → ③ 뽑힌 과제 → ④ 카테고리\u003c/div\u003e\n    \u003cdiv class=\"chain\"\u003e\n      \u003cdiv class=\"step\"\u003e\u003cspan style=\"color:var(--gold)\"\u003e\"${esc(s.quote)}\"\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"step\"\u003e${esc(s.text)}\u003c/div\u003e\n      \u003cdiv class=\"step\"\u003e\u003cb\u003e${esc(s.cat)}\u003c/b\u003e\u003cbr\u003e\n        \u003cspan style=\"color:var(--dim);font-size:11.5px\"\u003e${esc(c.definition || \"\")}\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"lbl\"\u003e이 카테고리\u003c/div\u003e\n    \u003cdiv style=\"font-size:11.5px;color:#aab3cc;line-height:1.8\"\u003e\n      ${c.people}명이 언급 · ${c.pjt_spread}개 조직 · ${c.cl_spread}개 직급\u003cbr\u003e\n      보유 ${c.have} / 갭 ${c.gap} · ${esc(c.readiness || \"\")}\n    \u003c/div\u003e`;\n  d.classList.add(\"show\");\n  draw();\n}\nfunction closeDetail() { sel = null; document.getElementById(\"detail\").classList.remove(\"show\"); draw(); }\n\ncv.addEventListener(\"click\", e =\u003e { const s = hit(e.clientX, e.clientY); s ? openDetail(s) : closeDetail(); });\ncv.addEventListener(\"mousemove\", e =\u003e {\n  const s = hit(e.clientX, e.clientY), tip = document.getElementById(\"tip\");\n  cv.style.cursor = s ? \"pointer\" : \"crosshair\";\n  if (!s) { tip.style.display = \"none\"; hover = null; return; }\n  hover = s;\n  tip.innerHTML = `\u003cb\u003e${esc(s.text)}\u003c/b\u003e\u003cbr\u003e\u003cspan style=\"color:#5b6480\"\u003e${esc(s.cat)}\u003c/span\u003e`;\n  tip.style.display = \"block\";\n  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + \"px\";\n  tip.style.top = (e.clientY + 14) + \"px\";\n});\ncv.addEventListener(\"wheel\", e =\u003e {\n  e.preventDefault();\n  view.k = Math.max(0.35, Math.min(3, view.k * (e.deltaY \u003c 0 ? 1.1 : 0.9)));\n  draw();\n}, { passive: false });\n\nconst NOTES = {\n  empty: \"해석층 — 표시된 영역은 \u003cb\u003e한 조직에서만\u003c/b\u003e 나왔거나 보유 없이 \u003cb\u003e갭만\u003c/b\u003e 있는 \" +\n         \"카테고리다. 우리가 넓게 보지 못한 방향이라는 뜻이지 안 중요하다는 뜻이 아니다. \" +\n         \"왜 좁게 나왔는지는 데이터가 아니라 워크숍에서 사람이 답한다.\",\n  ax: \"AX 표현이 원문 인용에 \u003cb\u003e실제로 적혀 있었다\u003c/b\u003e는 관찰이다. \" +\n      \"이게 진짜 AX 과제냐는 판정은 파이프라인이 하지 않는다.\",\n};\nfunction setMode(m) {\n  mode = m;\n  for (const id of [\"front\", \"empty\", \"ax\"])\n    document.getElementById(\"m-\" + id).classList.toggle(\"on\", id === m);\n  const note = document.getElementById(\"note\");\n  note.innerHTML = NOTES[m] || \"\";\n  note.classList.toggle(\"show\", !!NOTES[m]);\n  draw();\n}\ndocument.getElementById(\"m-front\").onclick = () =\u003e setMode(\"front\");\ndocument.getElementById(\"m-empty\").onclick = () =\u003e setMode(\"empty\");\ndocument.getElementById(\"m-ax\").onclick = () =\u003e setMode(\"ax\");\n\n// 딥링크 — 발표 시퀀스(#021)와 헤드리스 검증 겸용. 기존 은하수의 #ego=와 같은 규약.\nfunction applyHash() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  if (h.get(\"mode\")) setMode(h.get(\"mode\"));\n  const id = h.get(\"star\");\n  if (id) { const s = DATA.stars.find(s =\u003e s.id === id); if (s) openDetail(s); }\n}\naddEventListener(\"hashchange\", applyHash);\n\nresize();\napplyHash();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n", "heatmap": "\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003e부서 단면 — 팀 × 주제\u003c/title\u003e\n\u003cstyle\u003e\n  :root { --bg:#faf9f7; --ink:#16181d; --dim:#767d8c; --line:#e2e0dc; --ink2:#0f172a; }\n  * { box-sizing:border-box; }\n  body { margin:0; background:var(--bg); color:var(--ink); padding:44px 40px 60px;\n         font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Segoe UI\",sans-serif; }\n  .wrap { max-width:1180px; margin:0 auto; }\n  h1 { font-size:26px; margin:0 0 6px; font-weight:650; letter-spacing:-.01em; }\n  .lbl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }\n  .read { margin:22px 0 26px; display:grid; gap:12px; grid-template-columns:1fr 1fr;\n          border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:18px 0; }\n  .read div { font-size:13px; line-height:1.7; }\n  .read b { font-weight:650; }\n  table { border-collapse:collapse; width:100%; }\n  th, td { padding:0; }\n  th.cat { font-size:11px; font-weight:500; color:var(--dim); text-align:left; height:132px;\n           vertical-align:bottom; padding-bottom:9px; white-space:nowrap; width:64px; }\n  th.cat span { display:inline-block; transform:rotate(-90deg) translateX(4px); transform-origin:left bottom; }\n  th.pjt { text-align:right; padding-right:14px; font-size:13px; font-weight:600; white-space:nowrap; }\n  td.cell { width:64px; height:46px; text-align:center; border:1px solid var(--bg);\n            font-size:12px; font-variant-numeric:tabular-nums; }\n  td.tot, th.tot { font-size:11px; color:var(--dim); text-align:right; padding-left:12px;\n                   font-variant-numeric:tabular-nums; }\n  tr.kind td { font-size:10px; color:var(--dim); text-align:center; padding-top:6px; }\n  .k공통 { color:#0f172a; font-weight:650; }\n  .k국소 { color:#b45309; font-weight:650; }\n  .foot { margin-top:28px; font-size:12px; color:var(--dim); line-height:1.8; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"wrap\"\u003e\n  \u003cdiv class=\"lbl\"\u003etask-discovery · 부서 단면\u003c/div\u003e\n  \u003ch1\u003e팀마다 무엇이 다른가\u003c/h1\u003e\n  \u003cdiv class=\"lbl\" id=\"scale\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"read\"\u003e\n    \u003cdiv\u003e\u003cb\u003e가로로 고르게 진한 줄\u003c/b\u003e — 그 조직이 여러 주제를 폭넓게 말했다.\n      한 칸만 진하면 그 조직의 관심이 한 곳에 몰려 있다는 뜻이다.\u003c/div\u003e\n    \u003cdiv\u003e\u003cb\u003e세로로 전부 진한 열\u003c/b\u003e — 전 조직이 말한 \u003cb\u003e공통 주제\u003c/b\u003e. 한 칸만 진한 열은\n      \u003cb\u003e그 조직만의 주제\u003c/b\u003e다. 둘은 워크숍에서 다르게 다뤄야 한다.\u003c/div\u003e\n  \u003c/div\u003e\n\n  \u003cdiv id=\"table\"\u003e\u003c/div\u003e\n\n  \u003cdiv class=\"foot\" id=\"foot\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\nconst D = {\"pjts\": [\"공정기술\", \"기획운영\", \"양산기술\"], \"cats\": [\"AX 기반 테스트 데이터 분석\", \"Burn-in 신뢰성·BIB 관리\", \"D1b 신제품 램프업\", \"DPPM 품질 선제진단\", \"STDF 기반 고장분석 자동화\", \"Test PGM 디버깅·구조 최적화\", \"고온·챔버 테스트 조건 정교화\", \"병렬 테스트·멀티사이트 효율화\", \"설비 운영·자동화 표준화\", \"양산 Yield 안정화\"], \"grid\": [[32, 54, 0, 47, 44, 16, 61, 0, 12, 0], [36, 0, 18, 2, 6, 4, 0, 0, 22, 0], [30, 0, 24, 19, 10, 69, 0, 59, 9, 21]], \"peak\": 69, \"rows\": [{\"pjt\": \"공정기술\", \"cells\": [32, 54, 0, 47, 44, 16, 61, 0, 12, 0], \"total\": 266}, {\"pjt\": \"기획운영\", \"cells\": [36, 0, 18, 2, 6, 4, 0, 0, 22, 0], \"total\": 88}, {\"pjt\": \"양산기술\", \"cells\": [30, 0, 24, 19, 10, 69, 0, 59, 9, 21], \"total\": 241}], \"cols\": [{\"cat\": \"AX 기반 테스트 데이터 분석\", \"total\": 98, \"orgs\": 3, \"kind\": \"공통\"}, {\"cat\": \"Burn-in 신뢰성·BIB 관리\", \"total\": 54, \"orgs\": 1, \"kind\": \"국소\"}, {\"cat\": \"D1b 신제품 램프업\", \"total\": 42, \"orgs\": 2, \"kind\": \"부분\"}, {\"cat\": \"DPPM 품질 선제진단\", \"total\": 68, \"orgs\": 3, \"kind\": \"공통\"}, {\"cat\": \"STDF 기반 고장분석 자동화\", \"total\": 60, \"orgs\": 3, \"kind\": \"공통\"}, {\"cat\": \"Test PGM 디버깅·구조 최적화\", \"total\": 89, \"orgs\": 3, \"kind\": \"공통\"}, {\"cat\": \"고온·챔버 테스트 조건 정교화\", \"total\": 61, \"orgs\": 1, \"kind\": \"국소\"}, {\"cat\": \"병렬 테스트·멀티사이트 효율화\", \"total\": 59, \"orgs\": 1, \"kind\": \"국소\"}, {\"cat\": \"설비 운영·자동화 표준화\", \"total\": 43, \"orgs\": 3, \"kind\": \"공통\"}, {\"cat\": \"양산 Yield 안정화\", \"total\": 21, \"orgs\": 1, \"kind\": \"국소\"}], \"totals\": {\"cards\": 595, \"common\": 5, \"local\": 4}};\n\nfunction shade(n) {\n  if (!n) return \"#f1efec\";\n  const t = Math.pow(n / D.peak, 0.65);              // 감마 — 낮은 값도 보이게\n  const c = [ [232,229,224], [15,23,42] ];\n  const mix = c[0].map((v, i) =\u003e Math.round(v + (c[1][i] - v) * t));\n  return `rgb(${mix.join(\",\")})`;\n}\nfunction ink(n) { return n / D.peak \u003e 0.45 ? \"#f8fafc\" : \"#3b4252\"; }\n\nlet h = \"\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\";\nfor (const c of D.cats) h += `\u003cth class=\"cat\"\u003e\u003cspan\u003e${c}\u003c/span\u003e\u003c/th\u003e`;\nh += `\u003cth class=\"tot\"\u003e합\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e`;\nD.rows.forEach(r =\u003e {\n  h += `\u003ctr\u003e\u003cth class=\"pjt\"\u003e${r.pjt}\u003c/th\u003e`;\n  r.cells.forEach(n =\u003e {\n    h += `\u003ctd class=\"cell\" style=\"background:${shade(n)};color:${ink(n)}\"\u003e${n || \"\"}\u003c/td\u003e`;\n  });\n  h += `\u003ctd class=\"tot\"\u003e${r.total}\u003c/td\u003e\u003c/tr\u003e`;\n});\nh += `\u003ctr class=\"kind\"\u003e\u003ctd\u003e\u003c/td\u003e`;\nD.cols.forEach(c =\u003e { h += `\u003ctd class=\"k${c.kind}\"\u003e${c.kind}\u003c/td\u003e`; });\nh += `\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e`;\ndocument.getElementById(\"table\").innerHTML = h;\n\ndocument.getElementById(\"scale\").textContent =\n  `조직 ${D.pjts.length} × 카테고리 ${D.cats.length} · 배정 ${D.totals.cards}건 · 최대 칸 ${D.peak}건`;\ndocument.getElementById(\"foot\").innerHTML =\n  `전 조직이 말한 공통 주제 \u003cb\u003e${D.totals.common}개\u003c/b\u003e, 한 조직에서만 나온 주제 ` +\n  `\u003cb\u003e${D.totals.local}개\u003c/b\u003e. 숫자는 배정된 과제·역량 항목 수이며 중요도가 아니다 — ` +\n  `많이 말했다는 것과 중요하다는 것은 데이터가 구별하지 못한다.`;\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n", "questions": "\u003c!doctype html\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003ctitle\u003e질문 카드 — 그래서 뭘 논의하나\u003c/title\u003e\n\u003cstyle\u003e\n  :root { --bg:#faf9f7; --ink:#16181d; --dim:#767d8c; --line:#e2e0dc; }\n  * { box-sizing:border-box; }\n  body { margin:0; background:var(--bg); color:var(--ink); padding:44px 40px 72px;\n         font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Segoe UI\",sans-serif; }\n  .wrap { max-width:960px; margin:0 auto; }\n  .lbl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }\n  h1 { font-size:27px; margin:6px 0 10px; font-weight:650; letter-spacing:-.01em; }\n  .intro { font-size:13.5px; color:#454b57; line-height:1.75; max-width:640px;\n           border-bottom:1px solid var(--line); padding-bottom:22px; }\n  .card { background:#fff; border:1px solid var(--line); border-radius:9px; padding:20px 22px;\n          margin-top:16px; }\n  .kind { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#b45309;\n          font-weight:650; }\n  .q { font-size:17px; line-height:1.55; margin:8px 0 10px; font-weight:600; letter-spacing:-.005em; }\n  .why { font-size:12.5px; color:#5b6270; line-height:1.7; }\n  .ev { margin-top:13px; display:flex; gap:7px; flex-wrap:wrap; }\n  .ev span { font-size:11px; font-family:ui-monospace,SFMono-Regular,monospace; color:#3b4252;\n             background:#f1efec; border:1px solid var(--line); border-radius:99px; padding:3px 10px; }\n  .foot { margin-top:34px; padding-top:20px; border-top:1px solid var(--line);\n          font-size:12px; color:var(--dim); line-height:1.8; }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"wrap\"\u003e\n  \u003cdiv class=\"lbl\"\u003etask-discovery · 워크숍 아젠다\u003c/div\u003e\n  \u003ch1\u003e그래서 뭘 논의하나\u003c/h1\u003e\n  \u003cdiv class=\"intro\"\u003e집계에서 규칙으로 뽑은 질문이다. LLM은 쓰지 않았고, 각 질문에는 그것을\n    만들어낸 수치가 붙어 있다. \u003cb\u003e질문만 만들고 답은 하지 않는다\u003c/b\u003e — 답은 이 자리에 모인\n    사람이 채운다.\u003c/div\u003e\n  \u003cdiv id=\"cards\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"foot\" id=\"foot\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cscript\u003e\nconst D = {\"questions\": [{\"kind\": \"가장 넓게 나온 것\", \"q\": \"AX 기반 테스트 데이터 분석 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?\", \"why\": \"여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.\", \"evidence\": [\"74명이 언급\", \"3개 조직\", \"3개 직급\"], \"cat\": \"AX 기반 테스트 데이터 분석\"}, {\"kind\": \"가장 넓게 나온 것\", \"q\": \"DPPM 품질 선제진단 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?\", \"why\": \"여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.\", \"evidence\": [\"56명이 언급\", \"3개 조직\", \"3개 직급\"], \"cat\": \"DPPM 품질 선제진단\"}, {\"kind\": \"가장 넓게 나온 것\", \"q\": \"Test PGM 디버깅·구조 최적화 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?\", \"why\": \"여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.\", \"evidence\": [\"55명이 언급\", \"3개 조직\", \"3개 직급\"], \"cat\": \"Test PGM 디버깅·구조 최적화\"}, {\"kind\": \"한 조직만 본 것\", \"q\": \"고온·챔버 테스트 조건 정교화 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?\", \"why\": \"확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.\", \"evidence\": [\"1개 조직\", \"38명이 언급\"], \"cat\": \"고온·챔버 테스트 조건 정교화\"}, {\"kind\": \"한 조직만 본 것\", \"q\": \"병렬 테스트·멀티사이트 효율화 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?\", \"why\": \"확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.\", \"evidence\": [\"1개 조직\", \"33명이 언급\"], \"cat\": \"병렬 테스트·멀티사이트 효율화\"}, {\"kind\": \"한 조직만 본 것\", \"q\": \"Burn-in 신뢰성·BIB 관리 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?\", \"why\": \"확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.\", \"evidence\": [\"1개 조직\", \"33명이 언급\"], \"cat\": \"Burn-in 신뢰성·BIB 관리\"}, {\"kind\": \"하겠다는데 할 사람이 없는 것\", \"q\": \"고온·챔버 테스트 조건 정교화 — 갭은 19건인데 보유는 0건이다. 누가 이걸 하나?\", \"why\": \"필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.\", \"evidence\": [\"갭 19건\", \"보유 0건\", \"갭만 있음\"], \"cat\": \"고온·챔버 테스트 조건 정교화\"}, {\"kind\": \"하겠다는데 할 사람이 없는 것\", \"q\": \"병렬 테스트·멀티사이트 효율화 — 갭은 18건인데 보유는 0건이다. 누가 이걸 하나?\", \"why\": \"필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.\", \"evidence\": [\"갭 18건\", \"보유 0건\", \"갭만 있음\"], \"cat\": \"병렬 테스트·멀티사이트 효율화\"}, {\"kind\": \"하겠다는데 할 사람이 없는 것\", \"q\": \"Burn-in 신뢰성·BIB 관리 — 갭은 7건인데 보유는 0건이다. 누가 이걸 하나?\", \"why\": \"필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.\", \"evidence\": [\"갭 7건\", \"보유 0건\", \"갭만 있음\"], \"cat\": \"Burn-in 신뢰성·BIB 관리\"}, {\"kind\": \"하겠다는데 할 사람이 없는 것\", \"q\": \"D1b 신제품 램프업 — 갭은 7건인데 보유는 0건이다. 누가 이걸 하나?\", \"why\": \"필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.\", \"evidence\": [\"갭 7건\", \"보유 0건\", \"갭만 있음\"], \"cat\": \"D1b 신제품 램프업\"}, {\"kind\": \"되는 사람과 안 되는 사람이 갈리는 것\", \"q\": \"AX 기반 테스트 데이터 분석 — 보유 75건과 갭 7건이 같이 있다. 왜 누구는 되고 누구는 안 되나?\", \"why\": \"역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.\", \"evidence\": [\"보유 75건\", \"갭 7건\", \"74명이 언급\"], \"cat\": \"AX 기반 테스트 데이터 분석\"}, {\"kind\": \"되는 사람과 안 되는 사람이 갈리는 것\", \"q\": \"DPPM 품질 선제진단 — 보유 37건과 갭 5건이 같이 있다. 왜 누구는 되고 누구는 안 되나?\", \"why\": \"역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.\", \"evidence\": [\"보유 37건\", \"갭 5건\", \"56명이 언급\"], \"cat\": \"DPPM 품질 선제진단\"}, {\"kind\": \"되는 사람과 안 되는 사람이 갈리는 것\", \"q\": \"Test PGM 디버깅·구조 최적화 — 보유 34건과 갭 8건이 같이 있다. 왜 누구는 되고 누구는 안 되나?\", \"why\": \"역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.\", \"evidence\": [\"보유 34건\", \"갭 8건\", \"55명이 언급\"], \"cat\": \"Test PGM 디버깅·구조 최적화\"}], \"totals\": {\"n\": 13, \"cats\": 10}};\ndocument.getElementById(\"cards\").innerHTML = D.questions.map(q =\u003e `\n  \u003cdiv class=\"card\"\u003e\n    \u003cdiv class=\"kind\"\u003e${q.kind}\u003c/div\u003e\n    \u003c
