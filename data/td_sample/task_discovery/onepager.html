  cx.textAlign = "center"; cx.font = `${10.5 * dpr}px -apple-system, sans-serif`;
  for (const c of D.cats) {
    const [x, y] = P(c);
    cx.fillStyle = c.sparse ? "#b45309" : "#767d8c";
    cx.fillText(c.name, x, y - 22 * dpr);
  }
}
draw(); addEventListener("resize", draw);
</script>
