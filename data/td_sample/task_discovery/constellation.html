<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성좌 지도 — 무엇을 말했나</title>
<style>
  :root { --bg:#070912; --ink:#e8ecf8; --dim:#5b6480; --line:#1b2136; --gold:#f0c674; --teal:#5ad2c4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; }
  canvas { display:block; cursor:crosshair; }
  .panel { position:fixed; background:rgba(10,13,25,.93); border:1px solid var(--line);
           border-radius:8px; backdrop-filter:blur(8px); }
  #hud { top:16px; left:16px; padding:14px 16px; max-width:340px; }
  h1 { margin:0 0 4px; font-size:15px; letter-spacing:.02em; font-weight:600; }
  .sub { font-size:11px; color:var(--dim); line-height:1.6; }
  .modes { margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#141a2e; color:var(--ink); border:1px solid var(--line); border-radius:5px;
           padding:6px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
  button.on { background:var(--gold); color:#12151f; border-color:var(--gold); font-weight:600; }
  button:hover:not(.on) { border-color:var(--dim); }
  #note { margin-top:10px; font-size:11px; line-height:1.6; padding:8px 10px; border-radius:5px;
          display:none; }
  #note.show { display:block; }
  .warn { background:rgba(240,198,116,.1); border:1px solid rgba(240,198,116,.35); color:#f5d99a; }
  #legend { bottom:16px; left:16px; padding:12px 14px; font-size:11px; color:var(--dim); line-height:1.9; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #detail { top:16px; right:16px; width:390px; max-height:calc(100vh - 32px); overflow-y:auto;
            padding:16px 18px; display:none; }
  #detail.show { display:block; }
  .lbl { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
         margin:14px 0 5px; }
  .lbl:first-child { margin-top:0; }
  .chain { border-left:2px solid var(--line); padding-left:12px; margin-left:3px; }
  .chain .step { margin-bottom:12px; font-size:12.5px; line-height:1.65; }
  .src { font-size:11.5px; line-height:1.75; color:#aab3cc; max-height:190px; overflow-y:auto;
         white-space:pre-wrap; background:#0b0f1c; padding:10px; border-radius:5px; }
  mark { background:rgba(240,198,116,.28); color:#fbe6b4; border-radius:2px; padding:0 2px; }
  .tag { display:inline-block; font-size:10px; padding:2px 7px; border-radius:99px;
         border:1px solid var(--line); color:var(--dim); margin:0 4px 4px 0; }
  .tag.ax { border-color:var(--teal); color:var(--teal); }
  .close { float:right; background:none; border:none; color:var(--dim); font-size:16px; padding:0 4px; }
  #tip { position:fixed; pointer-events:none; background:rgba(8,11,20,.95); border:1px solid var(--line);
         padding:7px 10px; border-radius:5px; font-size:11.5px; display:none; max-width:290px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="hud" class="panel">
  <h1>성좌 지도</h1>
  <div class="sub">별 하나 = 과제 하나. 같은 카테고리가 한 별자리.<br>
    크기 = 확산도(몇 조직이 말했나) · 위치는 결정적이라 매번 같다.</div>
  <div class="modes">
    <button id="m-front" class="on">성좌</button>
    <button id="m-empty">빈 하늘</button>
    <button id="m-ax">AX 렌즈</button>
  </div>
  <div id="note" class="warn"></div>
</div>

<div id="legend" class="panel">
  <div><span class="sw" style="background:#e8ecf8"></span>과제 (별)</div>
  <div><span class="sw" style="background:#5ad2c4"></span>AX를 <b>언급한</b> 과제 — 판정 아님</div>
  <div><span class="sw" style="background:#f0c674"></span>희박한 영역 (한 조직만 / 갭만 있음)</div>
  <div style="margin-top:6px;color:#39405a">별을 클릭하면 원문까지의 계보가 열린다</div>
</div>

<div id="detail" class="panel"></div>
<div id="tip"></div>

adyne 플랫폼 멀티사이트 확대에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "3": "1. 상반기 성과 및 하반기 전략\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "4": "1. 상반기 성과 및 하반기 전략\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "5": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "6": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "7": "올해는 Teradyne 플랫폼 멀티사이트 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 테스트 타임 단축을 위한 PGM 구조 최적화도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "8": "앞으로의 방향\n설비 운영 지표 표준화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 D1b 신제품 램프업 기획 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "9": "1. 상반기 성과 및 하반기 전략\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "10": "앞으로의 방향\nDPPM 품질 개선을 위한 선제 진단을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "11": "1. 상반기 성과 및 하반기 전략\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "12": "1. 상반기 성과 및 하반기 전략\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "13": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "14": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "15": "앞으로의 방향\nMagnum 테스터 Para 병렬 테스트 효율화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "16": "올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 설비 자동화 제어도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 ATE 스크립팅를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "17": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "18": "1. 상반기 성과 및 하반기 전략\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "19": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "20": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "21": "1. 상반기 성과 및 하반기 전략\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "22": "1. 상반기 성과 및 하반기 전략\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 설비 운영 지표 표준화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "23": "1. 상반기 성과 및 하반기 전략\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "24": "1. 상반기 성과 및 하반기 전략\n상반기에는 AX(AI Transformation) 기반 테스트 데이터 분석 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "25": "앞으로의 방향\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 STDF 기반 고장분석(FA) 자동화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "26": "올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 설비 자동화 제어를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "27": "1. 상반기 성과 및 하반기 전략\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "28": "앞으로의 방향\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "29": "1. 상반기 성과 및 하반기 전략\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "30": "앞으로의 방향\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "31": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Teradyne 플랫폼 멀티사이트 확대에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Teradyne 플랫폼 멀티사이트 확대 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "32": "올해는 AX(AI Transformation) 기반 테스트 데이터 분석 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 설비 운영 지표 표준화를 해보고 싶은데 D1b 신제품 램프업 기획도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "33": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "34": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "35": "올해는 D1b 신제품 램프업 기획 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 데이터(STDF) 통합 관리 체계를 해보고 싶은데 AX(AI Transformation) 기반 테스트 데이터 분석도 관심이 있습니다. 그동안 배운 STDF 파싱 자동화를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "36": "1. 상반기 성과 및 하반기 전략\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "37": "올해는 신제품 D1b 초기 양산 Yield 안정화 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 테스트 타임 단축을 위한 PGM 구조 최적화를 해보고 싶은데 양산 Yield 저하 원인 분석·개선도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "38": "1. 상반기 성과 및 하반기 전략\n상반기에는 Advantest V93000 Test PGM 디버깅 시간 단축 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "39": "앞으로의 방향\nSTDF 기반 고장분석(FA) 자동화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 파이썬 데이터 분석와(과) 설비 자동화 제어 역량을 확보해 왔다. 단기적으로는 DPPM 품질 개선을 위한 선제 진단 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "40": "1. 상반기 성과 및 하반기 전략\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "41": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "42": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "43": "올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 머신러닝 이상탐지도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "44": "앞으로의 방향\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "45": "올해는 MBT(Monitoring Burn-in Test) 신뢰성 강화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 HFT(High-temp Final Test) 커버리지 확대도 관심이 있습니다. 그동안 배운 파이썬 데이터 분석를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "46": "1. 상반기 성과 및 하반기 전략\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "47": "앞으로의 방향\nHFT(High-temp Final Test) 커버리지 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 통계적 공정관리(SPC)와(과) STDF 파싱 자동화 역량을 확보해 왔다. 단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "48": "1. 상반기 성과 및 하반기 전략\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "49": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "50": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 신제품 D1b 초기 양산 Yield 안정화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "51": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "52": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 AX(AI Transformation) 기반 테스트 데이터 분석에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "53": "1. 상반기 성과 및 하반기 전략\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "54": "1. 상반기 성과 및 하반기 전략\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "55": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "56": "앞으로의 방향\nTeradyne 플랫폼 멀티사이트 확대을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 통계적 공정관리(SPC) 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "57": "1. 상반기 성과 및 하반기 전략\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "58": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "59": "1. 상반기 성과 및 하반기 전략\n상반기에는 STDF 기반 고장분석(FA) 자동화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 HFT(High-temp Final Test) 커버리지 확대에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 HFT(High-temp Final Test) 커버리지 확대 체계를 만들고 싶다. 장기적으로는 CLT(Chamber형 LFT Test) 조건 정교화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "60": "1. 상반기 성과 및 하반기 전략\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 데이터(STDF) 통합 관리 체계에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 테스트 데이터(STDF) 통합 관리 체계 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", m 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "69": "1. 상반기 성과 및 하반기 전략\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 BIB(Burn-in Board) 설계·수명 관리까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "70": "앞으로의 방향\n테스트 타임 단축을 위한 PGM 구조 최적화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 설비 자동화 제어와(과) 머신러닝 이상탐지 역량을 확보해 왔다. 단기적으로는 신제품 D1b 초기 양산 Yield 안정화 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "71": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 데이터(STDF) 통합 관리 체계 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 D1b 신제품 램프업 기획까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "72": "1. 상반기 성과 및 하반기 전략\n상반기에는 신제품 D1b 초기 양산 Yield 안정화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "73": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 테스트 타임 단축을 위한 PGM 구조 최적화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 테스트 타임 단축을 위한 PGM 구조 최적화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "74": "올해는 Magnum 테스터 Para 병렬 테스트 효율화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 양산 Yield 저하 원인 분석·개선를 해보고 싶은데 Teradyne 플랫폼 멀티사이트 확대도 관심이 있습니다. 그동안 배운 머신러닝 이상탐지를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "75": "올해는 HFT(High-temp Final Test) 커버리지 확대 관련 일을 많이 했습니다. 파이썬 데이터 분석도 익혔고요. 앞으로 DPPM 품질 개선을 위한 선제 진단를 해보고 싶은데 STDF 기반 고장분석(FA) 자동화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "76": "1. 상반기 성과 및 하반기 전략\n상반기에는 HFT(High-temp Final Test) 커버리지 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "77": "1. 상반기 성과 및 하반기 전략\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 CLT(Chamber형 LFT Test) 조건 정교화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 통계적 공정관리(SPC)를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 CLT(Chamber형 LFT Test) 조건 정교화 체계를 만들고 싶다. 장기적으로는 STDF 기반 고장분석(FA) 자동화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "78": "1. 상반기 성과 및 하반기 전략\n상반기에는 설비 운영 지표 표준화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 D1b 신제품 램프업 기획에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 D1b 신제품 램프업 기획 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "79": "1. 상반기 성과 및 하반기 전략\n상반기에는 DPPM 품질 개선을 위한 선제 진단 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "80": "1. 상반기 성과 및 하반기 전략\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Magnum 테스터 Para 병렬 테스트 효율화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Magnum 테스터 Para 병렬 테스트 효율화 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "81": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 장기적으로는 양산 Yield 저하 원인 분석·개선까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "82": "1. 상반기 성과 및 하반기 전략\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "83": "1. 상반기 성과 및 하반기 전략\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 STDF 기반 고장분석(FA) 자동화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 머신러닝 이상탐지 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 STDF 기반 고장분석(FA) 자동화 체계를 만들고 싶다. 장기적으로는 DPPM 품질 개선을 위한 선제 진단까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "84": "앞으로의 방향\nBIB(Burn-in Board) 설계·수명 관리을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 머신러닝 이상탐지와(과) ATE 스크립팅 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "85": "1. 상반기 성과 및 하반기 전략\n상반기에는 테스트 타임 단축을 위한 PGM 구조 최적화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Magnum 테스터 Para 병렬 테스트 효율화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "86": "1. 상반기 성과 및 하반기 전략\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 AX(AI Transformation) 기반 테스트 데이터 분석까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "87": "그동안 여러 업무를 두루 경험했습니다. 앞으로도 팀에 보탬이 되도록 열심히 하겠습니다.", "88": "1. 상반기 성과 및 하반기 전략\n상반기에는 D1b 신제품 램프업 기획 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 설비 운영 지표 표준화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 설비 운영 지표 표준화 체계를 만들고 싶다. 장기적으로는 테스트 데이터(STDF) 통합 관리 체계까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "89": "앞으로의 방향\nMBT(Monitoring Burn-in Test) 신뢰성 강화을(를) 팀 표준으로 자리잡게 하는 것이 목표다. 지금은 담당자마다 방식이 달라 결과를 한곳에서 비교하기 어렵다. 이를 위해 STDF 파싱 자동화와(과) 파이썬 데이터 분석 역량을 확보해 왔다. 단기적으로는 HFT(High-temp Final Test) 커버리지 확대 파일럿을 추진하고, 검증한 절차를 표준에 반영하는 것까지가 계획이다.", "90": "1. 상반기 성과 및 하반기 전략\n상반기에는 BIB(Burn-in Board) 설계·수명 관리 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 STDF 파싱 자동화 역량을 확보했고, 최근에는 머신러닝 이상탐지를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 MBT(Monitoring Burn-in Test) 신뢰성 강화까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "91": "올해는 STDF 기반 고장분석(FA) 자동화 관련 일을 많이 했습니다. ATE 스크립팅도 익혔고요. 앞으로 MBT(Monitoring Burn-in Test) 신뢰성 강화를 해보고 싶은데 CLT(Chamber형 LFT Test) 조건 정교화도 관심이 있습니다. 그동안 배운 통계적 공정관리(SPC)를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "92": "1. 상반기 성과 및 하반기 전략\n상반기에는 CLT(Chamber형 LFT Test) 조건 정교화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 BIB(Burn-in Board) 설계·수명 관리에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 BIB(Burn-in Board) 설계·수명 관리 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "93": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 신제품 D1b 초기 양산 Yield 안정화에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 설비 자동화 제어 역량을 확보했고, 최근에는 파이썬 데이터 분석를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 신제품 D1b 초기 양산 Yield 안정화 체계를 만들고 싶다. 을 많이 했습니다. 통계적 공정관리(SPC)도 익혔고요. 앞으로 Advantest V93000 Test PGM 디버깅 시간 단축를 해보고 싶은데 양산 Yield 저하 원인 분석·개선도 관심이 있습니다. 그동안 배운 머신러닝 이상탐지를 살려서 팀에 도움이 되면 좋겠습니다. 이것저것 하다 보니 정리가 잘 안 되네요.", "118": "1. 상반기 성과 및 하반기 전략\n상반기에는 양산 Yield 저하 원인 분석·개선 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 Advantest V93000 Test PGM 디버깅 시간 단축에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 파이썬 데이터 분석 역량을 확보했고, 최근에는 ATE 스크립팅를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축 체계를 만들고 싶다. 장기적으로는 Teradyne 플랫폼 멀티사이트 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "119": "1. 상반기 성과 및 하반기 전략\n상반기에는 MBT(Monitoring Burn-in Test) 신뢰성 강화 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 DPPM 품질 개선을 위한 선제 진단에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 ATE 스크립팅 역량을 확보했고, 최근에는 STDF 파싱 자동화를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 DPPM 품질 개선을 위한 선제 진단 체계를 만들고 싶다. 장기적으로는 HFT(High-temp Final Test) 커버리지 확대까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다.", "120": "1. 상반기 성과 및 하반기 전략\n상반기에는 Teradyne 플랫폼 멀티사이트 확대 업무를 맡아 성과를 냈다. 진행 과정에서 반복 수작업이 병목임을 확인했고, 이 경험이 하반기 계획의 출발점이 됐다. 하반기에는 양산 Yield 저하 원인 분석·개선에 집중하려 한다.\n2. 커리어 회고 및 확보 역량\n현장 업무를 거치며 통계적 공정관리(SPC) 역량을 확보했고, 최근에는 설비 자동화 제어를 실무에 적용해 왔다.\n3. 미래 업무\n단기적으로는 양산 Yield 저하 원인 분석·개선 체계를 만들고 싶다. 장기적으로는 Advantest V93000 Test PGM 디버깅 시간 단축까지 확장해, 팀이 재사용할 수 있는 기반을 만드는 것이 목표다."}, "anonymize": false, "totals": {"stars": 595, "cats": 10, "ax": 5, "sparse": 5}};
const cv = document.getElementById("sky"), cx = cv.getContext("2d");
let W, H, mode = "front", sel = null, hover = null;
let view = { x: 0, y: 0, k: 1 };

function resize() {
  W = cv.width = innerWidth * devicePixelRatio;
  H = cv.height = innerHeight * devicePixelRatio;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  draw();
}
addEventListener("resize", resize);

// 확산도 → 반지름. 조직 수가 1~3이라 폭이 좁으니 별 개수도 섞어 시각 대비를 준다.
const catByName = Object.fromEntries(DATA.cats.map(c => [c.name, c]));
function radius(s) {
  const c = catByName[s.cat] || {};
  return 1.6 + (c.pjt_spread || 1) * 0.9 + Math.min((c.cl_spread || 1), 3) * 0.35;
}
function toScreen(p) {
  return [W / 2 + (p.x + view.x) * view.k * devicePixelRatio,
          H / 2 + (p.y + view.y) * view.k * devicePixelRatio];
}

function starVisible(s) {
  if (mode === "ax") return s.ax;
  if (mode === "empty") return (catByName[s.cat] || {}).sparse;
  return true;
}

function draw() {
  cx.fillStyle = "#070912"; cx.fillRect(0, 0, W, H);

  // 별자리 선 — 같은 카테고리 별들을 앵커에 잇는다(성좌의 뼈대)
  for (const c of DATA.cats) {
    const dimmed = (mode === "empty" && !c.sparse) || mode === "ax";
    cx.strokeStyle = dimmed ? "rgba(27,33,54,.35)" : "rgba(70,82,120,.30)";
    cx.lineWidth = devicePixelRatio * 0.6;
    const [ax, ay] = toScreen(c);
    for (const s of DATA.stars) {
      if (s.cat !== c.name) continue;
      const [sx, sy] = toScreen(s);
      cx.beginPath(); cx.moveTo(ax, ay); cx.lineTo(sx, sy); cx.stroke();
    }
  }

  // 희박 영역 표시 (빈 하늘)
  if (mode === "empty") {
    for (const c of DATA.cats) {
      if (!c.sparse) continue;
      const [x, y] = toScreen(c);
      cx.strokeStyle = "rgba(240,198,116,.6)"; cx.lineWidth = devicePixelRatio * 1.3;
      cx.setLineDash([6 * devicePixelRatio, 5 * devicePixelRatio]);
      cx.beginPath(); cx.arc(x, y, 135 * view.k * devicePixelRatio, 0, 7); cx.stroke();
      cx.setLineDash([]);
    }
  }

  for (const s of DATA.stars) {
    const [x, y] = toScreen(s);
    const on = starVisible(s), r = radius(s) * view.k * devicePixelRatio;
    if (on && s.ax) { cx.fillStyle = "#5ad2c4"; }
    else if (on && mode === "empty") { cx.fillStyle = "#f0c674"; }
    else if (on) { cx.fillStyle = "#e8ecf8"; }
    else { cx.fillStyle = "rgba(91,100,128,.22)"; }
    if (on && (mode === "ax" || mode === "empty")) {
      cx.shadowColor = cx.fillStyle; cx.shadowBlur = 9 * devicePixelRatio;
    }
    cx.beginPath(); cx.arc(x, y, sel && sel.id === s.id ? r * 2.1 : r, 0, 7); cx.fill();
    cx.shadowBlur = 0;
    if (sel && sel.id === s.id) {
      cx.strokeStyle = "#f0c674"; cx.lineWidth = devicePixelRatio * 1.5;
      cx.beginPath(); cx.arc(x, y, r * 3.4, 0, 7); cx.stroke();
    }
  }

  // 카테고리 이름
  cx.textAlign = "center";
  for (const c of DATA.cats) {
    const [x, y] = toScreen(c);
    const faded = (mode === "empty" && !c.sparse) || (mode === "ax");
    cx.fillStyle = faded ? "#39405a" : (mode === "empty" && c.sparse ? "#f0c674" : "#8b95b4");
    cx.font = `${11.5 * devicePixelRatio}px -apple-system, sans-serif`;
    cx.fillText(c.name, x, y - 148 * view.k * devicePixelRatio);
    cx.fillStyle = "#39405a";
    cx.font = `${9.5 * devicePixelRatio}px ui-monospace, monospace`;
    cx.fillText(`${c.stars}과제 · ${c.people}명 · ${c.pjt_spread}조직`,
                x, y - 134 * view.k * devicePixelRatio);
  }
}

function hit(mx, my) {
  let best = null, bd = 16;
  for (const s of DATA.stars) {
    if (!starVisible(s)) continue;
    const [x, y] = toScreen(s);
    const d = Math.hypot(x / devicePixelRatio - mx, y / devicePixelRatio - my);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

const AXIS_KO = { future_task: "미래 과제", capability_have: "보유 역량",
                  capability_gap: "역량 갭", direction: "지향 방향" };

function esc(t) { return (t || "").replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m])); }

function openDetail(s) {
  sel = s;
  const c = catByName[s.cat] || {};
  const raw = DATA.sources[s.pid] || "";
  let src = esc(raw);
  if (raw && s.quote) {                     // 인용 구간을 원문 안에서 강조 (#015)
    const i = raw.indexOf(s.quote);
    if (i >= 0) src = esc(raw.slice(0, i)) + "<mark>" + esc(s.quote) + "</mark>" + esc(raw.slice(i + s.quote.length));
  }
  const d = document.getElementById("detail");
  d.innerHTML = `
    <button class="close" onclick="closeDetail()">×</button>
    <div class="lbl">계보 — 이 별은 어느 문장에서 왔나</div>
    <div>
      <span class="tag">${esc(AXIS_KO[s.axis] || s.axis)}</span>
      ${s.horizon ? `<span class="tag">${esc(s.horizon)}</span>` : ""}
      ${s.ax ? `<span class="tag ax">AX를 언급함</span>` : ""}
      <span class="tag">${esc(s.pjt || "")} · ${esc(s.cl || "")}</span>
    </div>
    <div class="lbl">① 회고 원문 ${s.person ? "— " + esc(s.person) : ""}</div>
    <div class="src">${src || "<i style='color:#39405a'>원문 없음 (익명 모드)</i>"}</div>
    <div class="lbl">② 인용 → ③ 뽑힌 과제 → ④ 카테고리</div>
    <div class="chain">
      <div class="step"><span style="color:var(--gold)">"${esc(s.quote)}"</span></div>
      <div class="step">${esc(s.text)}</div>
      <div class="step"><b>${esc(s.cat)}</b><br>
        <span style="color:var(--dim);font-size:11.5px">${esc(c.definition || "")}</span></div>
    </div>
    <div class="lbl">이 카테고리</div>
    <div style="font-size:11.5px;color:#aab3cc;line-height:1.8">
      ${c.people}명이 언급 · ${c.pjt_spread}개 조직 · ${c.cl_spread}개 직급<br>
      보유 ${c.have} / 갭 ${c.gap} · ${esc(c.readiness || "")}
    </div>`;
  d.classList.add("show");
  draw();
}
function closeDetail() { sel = null; document.getElementById("detail").classList.remove("show"); draw(); }

cv.addEventListener("click", e => { const s = hit(e.clientX, e.clientY); s ? openDetail(s) : closeDetail(); });
cv.addEventListener("mousemove", e => {
  const s = hit(e.clientX, e.clientY), tip = document.getElementById("tip");
  cv.style.cursor = s ? "pointer" : "crosshair";
  if (!s) { tip.style.display = "none"; hover = null; return; }
  hover = s;
  tip.innerHTML = `<b>${esc(s.text)}</b><br><span style="color:#5b6480">${esc(s.cat)}</span>`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  view.k = Math.max(0.35, Math.min(3, view.k * (e.deltaY < 0 ? 1.1 : 0.9)));
  draw();
}, { passive: false });

const NOTES = {
  empty: "해석층 — 표시된 영역은 <b>한 조직에서만</b> 나왔거나 보유 없이 <b>갭만</b> 있는 " +
         "카테고리다. 우리가 넓게 보지 못한 방향이라는 뜻이지 안 중요하다는 뜻이 아니다. " +
         "왜 좁게 나왔는지는 데이터가 아니라 워크숍에서 사람이 답한다.",
  ax: "AX 표현이 원문 인용에 <b>실제로 적혀 있었다</b>는 관찰이다. " +
      "이게 진짜 AX 과제냐는 판정은 파이프라인이 하지 않는다.",
};
function setMode(m) {
  mode = m;
  for (const id of ["front", "empty", "ax"])
    document.getElementById("m-" + id).classList.toggle("on", id === m);
  const note = document.getElementById("note");
  note.innerHTML = NOTES[m] || "";
  note.classList.toggle("show", !!NOTES[m]);
  draw();
}
document.getElementById("m-front").onclick = () => setMode("front");
document.getElementById("m-empty").onclick = () => setMode("empty");
document.getElementById("m-ax").onclick = () => setMode("ax");

// 딥링크 — 발표 시퀀스(#021)와 헤드리스 검증 겸용. 기존 은하수의 #ego=와 같은 규약.
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("mode")) setMode(h.get("mode"));
  const id = h.get("star");
  if (id) { const s = DATA.stars.find(s => s.id === id); if (s) openDetail(s); }
}
addEventListener("hashchange", applyHash);

resize();
applyHash();
</script>
