<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문 카드 — 그래서 뭘 논의하나</title>
<style>
  :root { --bg:#faf9f7; --ink:#16181d; --dim:#767d8c; --line:#e2e0dc; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); padding:44px 40px 72px;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; }
  .lbl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  h1 { font-size:27px; margin:6px 0 10px; font-weight:650; letter-spacing:-.01em; }
  .intro { font-size:13.5px; color:#454b57; line-height:1.75; max-width:640px;
           border-bottom:1px solid var(--line); padding-bottom:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:9px; padding:20px 22px;
          margin-top:16px; }
  .kind { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#b45309;
          font-weight:650; }
  .q { font-size:17px; line-height:1.55; margin:8px 0 10px; font-weight:600; letter-spacing:-.005em; }
  .why { font-size:12.5px; color:#5b6270; line-height:1.7; }
  .ev { margin-top:13px; display:flex; gap:7px; flex-wrap:wrap; }
  .ev span { font-size:11px; font-family:ui-monospace,SFMono-Regular,monospace; color:#3b4252;
             background:#f1efec; border:1px solid var(--line); border-radius:99px; padding:3px 10px; }
  .foot { margin-top:34px; padding-top:20px; border-top:1px solid var(--line);
          font-size:12px; color:var(--dim); line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lbl">task-discovery · 워크숍 아젠다</div>
  <h1>그래서 뭘 논의하나</h1>
  <div class="intro">집계에서 규칙으로 뽑은 질문이다. LLM은 쓰지 않았고, 각 질문에는 그것을
    만들어낸 수치가 붙어 있다. <b>질문만 만들고 답은 하지 않는다</b> — 답은 이 자리에 모인
    사람이 채운다.</div>
  <div id="cards"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const D = {"questions": [{"kind": "가장 넓게 나온 것", "q": "AX 기반 테스트 데이터 분석 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?", "why": "여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.", "evidence": ["74명이 언급", "3개 조직", "3개 직급"], "cat": "AX 기반 테스트 데이터 분석"}, {"kind": "가장 넓게 나온 것", "q": "DPPM 품질 선제진단 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?", "why": "여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.", "evidence": ["56명이 언급", "3개 조직", "3개 직급"], "cat": "DPPM 품질 선제진단"}, {"kind": "가장 넓게 나온 것", "q": "Test PGM 디버깅·구조 최적화 — 이렇게 많은 사람이 말했는데 왜 아직 안 되고 있나?", "why": "여러 조직·직급에서 반복해 나왔다. 합의가 아니라 미해결의 신호일 수 있다.", "evidence": ["55명이 언급", "3개 조직", "3개 직급"], "cat": "Test PGM 디버깅·구조 최적화"}, {"kind": "한 조직만 본 것", "q": "고온·챔버 테스트 조건 정교화 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?", "why": "확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.", "evidence": ["1개 조직", "38명이 언급"], "cat": "고온·챔버 테스트 조건 정교화"}, {"kind": "한 조직만 본 것", "q": "병렬 테스트·멀티사이트 효율화 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?", "why": "확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.", "evidence": ["1개 조직", "33명이 언급"], "cat": "병렬 테스트·멀티사이트 효율화"}, {"kind": "한 조직만 본 것", "q": "Burn-in 신뢰성·BIB 관리 — 한 조직에서만 나왔다. 선견인가, 그 조직의 사정인가?", "why": "확산도가 낮다는 것은 중요하지 않다는 뜻이 아니다. 아직 안 퍼졌다는 뜻이다.", "evidence": ["1개 조직", "33명이 언급"], "cat": "Burn-in 신뢰성·BIB 관리"}, {"kind": "하겠다는데 할 사람이 없는 것", "q": "고온·챔버 테스트 조건 정교화 — 갭은 19건인데 보유는 0건이다. 누가 이걸 하나?", "why": "필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.", "evidence": ["갭 19건", "보유 0건", "갭만 있음"], "cat": "고온·챔버 테스트 조건 정교화"}, {"kind": "하겠다는데 할 사람이 없는 것", "q": "병렬 테스트·멀티사이트 효율화 — 갭은 18건인데 보유는 0건이다. 누가 이걸 하나?", "why": "필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.", "evidence": ["갭 18건", "보유 0건", "갭만 있음"], "cat": "병렬 테스트·멀티사이트 효율화"}, {"kind": "하겠다는데 할 사람이 없는 것", "q": "Burn-in 신뢰성·BIB 관리 — 갭은 7건인데 보유는 0건이다. 누가 이걸 하나?", "why": "필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.", "evidence": ["갭 7건", "보유 0건", "갭만 있음"], "cat": "Burn-in 신뢰성·BIB 관리"}, {"kind": "하겠다는데 할 사람이 없는 것", "q": "D1b 신제품 램프업 — 갭은 7건인데 보유는 0건이다. 누가 이걸 하나?", "why": "필요하다고 말한 사람은 있는데 할 수 있다고 말한 사람이 없다. 채용·육성·외주 중 무엇으로 메울지는 데이터가 답하지 않는다.", "evidence": ["갭 7건", "보유 0건", "갭만 있음"], "cat": "D1b 신제품 램프업"}, {"kind": "되는 사람과 안 되는 사람이 갈리는 것", "q": "AX 기반 테스트 데이터 분석 — 보유 75건과 갭 7건이 같이 있다. 왜 누구는 되고 누구는 안 되나?", "why": "역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.", "evidence": ["보유 75건", "갭 7건", "74명이 언급"], "cat": "AX 기반 테스트 데이터 분석"}, {"kind": "되는 사람과 안 되는 사람이 갈리는 것", "q": "DPPM 품질 선제진단 — 보유 37건과 갭 5건이 같이 있다. 왜 누구는 되고 누구는 안 되나?", "why": "역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.", "evidence": ["보유 37건", "갭 5건", "56명이 언급"], "cat": "DPPM 품질 선제진단"}, {"kind": "되는 사람과 안 되는 사람이 갈리는 것", "q": "Test PGM 디버깅·구조 최적화 — 보유 34건과 갭 8건이 같이 있다. 왜 누구는 되고 누구는 안 되나?", "why": "역량이 조직 안에 있는데 퍼지지 않았다는 신호다. 이전 가능한 격차인지 본다.", "evidence": ["보유 34건", "갭 8건", "55명이 언급"], "cat": "Test PGM 디버깅·구조 최적화"}], "totals": {"n": 13, "cats": 10}};
document.getElementById("cards").innerHTML = D.questions.map(q => `
  <div class="card">
    <div class="kind">${q.kind}</div>
    <div class="q">${q.q}</div>
    <div class="why">${q.why}</div>
    <div class="ev">${q.evidence.filter(Boolean).map(e => `<span>${e}</span>`).join("")}</div>
  </div>`).join("") ||
  `<div class="card"><div class="q">규칙에 걸리는 카테고리가 없다</div>
   <div class="why">집계가 비었거나 모든 카테고리가 고르게 분포한 상태다. 빈 목록도 정상이다.</div></div>`;
document.getElementById("foot").textContent =
  `카테고리 ${D.totals.cats}개에서 질문 ${D.totals.n}개. 규칙: 확산도 상위 / 한 조직만 / ` +
  `갭만 있음 / 보유·갭 공존 / 소수의견.`;
</script>
</body>
</html>
