<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>미래 과제 · 근거 검토</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #172b46;
        --muted: #5c6e83;
        --line: #dbe3ed;
        --blue: #2864ad;
        --purple: #8060af;
        --paper: #f4f7fb;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          "Malgun Gothic",
          sans-serif;
      }
      header {
        padding: 30px 4vw 20px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .eyebrow {
        font:
          12px ui-monospace,
          monospace;
        letter-spacing: 0.16em;
        color: var(--blue);
      }
      h1 {
        font-size: 32px;
        letter-spacing: -0.05em;
        margin: 6px 0;
      }
      h2 {
        font-size: 21px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0;
      }
      .muted,
      small {
        color: var(--muted);
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
      }
      button,
      select,
      input {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        color: var(--ink);
        padding: 8px 13px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #eaf0f8;
      }
      button.active small {
        color: #e1eaf7;
      }
      button.active,
      button.primary {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      :focus-visible {
        outline: 3px solid #ce7b22;
        outline-offset: 3px;
      }
      nav,
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      nav {
        margin-top: 20px;
      }
      main {
        padding: 24px 4vw 40px;
      }
      .toolbar {
        margin-bottom: 18px;
      }
      .toolbar label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 370px;
        gap: 20px;
        align-items: start;
      }
      .surface,
      aside {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 22px;
        min-width: 0;
      }
      aside {
        max-height: 78vh;
        overflow: auto;
        position: sticky;
        top: 15px;
      }
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 5px;
        background: #eaf0f8;
        font-size: 12px;
        margin: 2px 4px 2px 0;
      }
      .badge.need {
        color: #65458f;
        background: #f0eafb;
      }
      .badge.have {
        color: #205c9f;
        background: #e6f0fc;
      }
      .notice {
        padding: 12px 16px;
        border-left: 3px solid #879db8;
        background: #edf2f8;
        margin: 12px 0;
      }
      .empty {
        padding: 35px 16px;
        text-align: center;
        color: var(--muted);
      }
      .item {
        padding: 17px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .item:last-child {
        border: 0;
      }
      blockquote,
      pre.source {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 8px 0 14px;
        padding: 12px 14px;
        background: #f4f7fb;
        border-left: 2px solid #9cafc8;
        font: inherit;
      }
      details {
        margin: 12px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        padding: 8px 0;
      }
      .stack {
        display: grid;
        gap: 10px;
      }
      .wide {
        width: 100%;
        text-align: left;
      }
      .chart {
        overflow: auto;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        min-width: 640px;
      }
      svg text {
        font-family: inherit;
        fill: var(--ink);
      }
      svg .bubble {
        cursor: pointer;
        stroke-width: 2;
        transition: opacity 0.15s;
      }
      svg .bubble:hover {
        opacity: 0.75;
      }
      svg .bubble:focus {
        outline: none;
        stroke: #172b46;
        stroke-width: 4;
      }
      .cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 12px 0;
      }
      .orb {
        border-radius: 50%;
        width: 116px;
        height: 116px;
        background: #e9f1fc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-wrap: anywhere;
        font-size: 13px;
        text-align: center;
        padding: 14px;
      }
      .orb strong {
        font-size: 23px;
      }
      .group {
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 110px;
        border: 1px solid #afbdd0;
        border-radius: 8px;
        padding: 12px;
        color: var(--ink);
        background: white;
      }
      label.field {
        display: block;
        margin: 15px 0;
      }
      label.field input,
      label.field select {
        display: block;
        width: 100%;
        margin-top: 5px;
      }
      .status {
        min-height: 26px;
        color: var(--blue);
      }
      .review-grid {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 22px;
      }
      .task-list {
        max-height: 78vh;
        overflow: auto;
      }
      .task-list button {
        margin-bottom: 8px;
      }
      .review-detail {
        max-width: 950px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .run {
        overflow-wrap: anywhere;
        font:
          12px ui-monospace,
          monospace;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 13px;
        margin: 12px 0;
      }
      @media (max-width: 1000px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          max-height: none;
        }
      }
      @media (max-width: 700px) {
        header {
          padding: 22px 18px;
        }
        main {
          padding: 18px;
        }
        h1 {
          font-size: 27px;
        }
        .surface,
        aside {
          padding: 16px;
        }
        .review-grid {
          grid-template-columns: 1fr;
        }
        .task-list {
          max-height: 250px;
        }
        .toolbar label {
          width: 100%;
          justify-content: space-between;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">NEBULA / EVIDENCE REVIEW</div>
      <h1>원문을 읽고, 과제를 검토합니다</h1>
      <p class="muted">
        승인 여부와 정정 제안을 각각 JSON으로 저장하세요. 내려받기 전 변경
        내용은 이 페이지에만 남습니다.
      </p>
      <div id="meta"></div>
      <p id="run" class="run"></p>
    </header>
    <main>
      <div class="toolbar">
        <label
          >검토 상태
          <select id="filter">
            <option value="">전체</option>
            <option value="pending">검토 대기</option>
            <option value="approved">승인</option>
            <option value="rejected">반려</option>
          </select></label
        ><label
          >과제 검색
          <input
            id="search"
            type="search"
            placeholder="과제 또는 작성자" /></label
        ><button id="export" class="primary">검토 결정 JSON 저장</button
        ><button id="correction-export">정정 제안 JSON 저장</button
        ><span id="progress"></span>
      </div>
      <p class="status" id="message" role="status" aria-live="polite"></p>
      <div class="review-grid">
        <section
          class="surface task-list"
          id="list"
          aria-label="검토할 과제"
        ></section>
        <section
          class="surface review-detail"
          id="detail"
          aria-label="과제 검토"
        ></section>
      </div>
      <section class="surface" style="margin-top: 20px">
        <h2>과제 밖의 기록</h2>
        <div id="other"></div>
      </section>
    </main>
    <script type="application/json" id="payload">
      __PAYLOAD__
    </script>
    <script>
      const D = JSON.parse(document.getElementById("payload").textContent);
      const arr = (v) => (Array.isArray(v) ? v : []);
      const $ = (id) => document.getElementById(id);
      const H = {
          short: "단기",
          mid: "중기",
          long: "장기",
          unknown: "시점 미정",
        },
        K = { have: "보유 언급", need: "필요 언급" },
        S = { pending: "초안 · 검토 대기", approved: "승인", rejected: "반려" };
      function el(tag, text, cls) {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = String(text ?? "");
        if (cls) n.className = cls;
        return n;
      }
      function add(parent, ...nodes) {
        parent.append(...nodes);
        return parent;
      }
      function badge(text, cls = "") {
        return el("span", text, "badge " + cls);
      }
      function empty(parent, text) {
        parent.append(el("p", text, "empty"));
      }
      function quote(parent, label, text) {
        parent.append(
          el("small", label),
          el("blockquote", text == null ? "제공되지 않음" : text),
        );
      }
      function button(text, fn, cls = "") {
        const b = el("button", text, cls);
        b.type = "button";
        b.onclick = fn;
        return b;
      }
      function detail(parent, title, text) {
        const d = el("details");
        add(d, el("summary", title), el("pre", text, "source"));
        parent.append(d);
      }
      function options(select, rows) {
        select.replaceChildren();
        for (const [value, label] of rows) {
          const o = el("option", label);
          o.value = value;
          select.append(o);
        }
      }
      const persons = arr(D.persons),
        tasks = arr(D.tasks),
        cats = arr(D.categories),
        pm = new Map(persons.map((p) => [String(p.id), p])),
        cm = new Map(cats.map((c) => [String(c.id), c]));
      const person = (id) => pm.get(String(id)),
        cat = (id) => cm.get(String(id))?.name || "미분류";
      function personName(id) {
        return person(id)?.name || String(id ?? "작성자 미상");
      }
      function meta() {
        add(
          $("meta"),
          badge(
            D.synthetic === true
              ? "합성 데이터"
              : D.synthetic === false
                ? "원본 기반 데이터"
                : "데이터 유형 미제공",
          ),
          badge(D.approved_only ? "승인된 과제만" : "초안 포함"),
        );
        $("run").textContent = "RUN " + (D.run_id ?? "미제공");
      }
      meta();
      const assignments = new Map(
          arr(D.assignments).map((a) => [String(a.task_id), a]),
        ),
        caps = new Map(arr(D.capabilities).map((c) => [String(c.id), c])),
        links = arr(D.links);
      const decisions = Object.create(null),
        corrections = new Map(
          arr(D.applied_corrections?.persons).map((e) => [
            String(e.person_id),
            e,
          ]),
        ),
        drafts = new Map();
      const inheritedCorrections = new Map(corrections);
      const originalAssignments = new Map(
        arr(D.original_assignments || D.assignments).map((a) => [
          String(a.task_id),
          a,
        ]),
      );
      function resetCorrection(id) {
        if (inheritedCorrections.has(id))
          corrections.set(id, inheritedCorrections.get(id));
        else corrections.delete(id);
      }
      const correctionEntries = arr(D.corrections_template?.persons);
      tasks.forEach((t) => {
        const r = D.review?.[t.id];
        decisions[t.id] = {
          status: S[r?.status] ? r.status : "pending",
          note: typeof r?.note === "string" ? r.note : "",
        };
        if (r && Object.hasOwn(r, "category_id"))
          decisions[t.id].category_id = r.category_id;
      });
      let selected = tasks[0]?.id,
        dirty = false;
      function changed() {
        dirty = true;
        $("message").textContent =
          "변경 내용이 있습니다. JSON을 내려받아 보관하세요.";
      }
      function list() {
        const box = $("list");
        box.replaceChildren(el("h2", "검토할 과제"));
        const q = $("search").value.toLocaleLowerCase(),
          filtered = tasks.filter(
            (t) =>
              (!$("filter").value ||
                decisions[t.id].status === $("filter").value) &&
              (t.label + " " + personName(t.person_id))
                .toLocaleLowerCase()
                .includes(q),
          );
        if (!filtered.length)
          empty(box, "검색 또는 상태에 해당하는 과제가 없습니다.");
        filtered.forEach((t) => {
          const b = button(
            "",
            () => {
              selected = t.id;
              list();
              show();
            },
            "wide" + (t.id === selected ? " active" : ""),
          );
          b.setAttribute("aria-pressed", String(t.id === selected));
          add(
            b,
            el("span", t.label),
            el("br"),
            el(
              "small",
              personName(t.person_id) + " · " + S[decisions[t.id].status],
            ),
          );
          box.append(b);
        });
        $("progress").textContent =
          tasks.filter((t) => decisions[t.id].status !== "pending").length +
          " / " +
          tasks.length +
          "개 검토 완료";
      }
      function field(parent, label, node) {
        const l = el("label", label, "field");
        l.append(node);
        parent.append(l);
        return node;
      }
      function show() {
        const box = $("detail"),
          t = tasks.find((t) => t.id === selected);
        box.replaceChildren();
        if (!t) {
          empty(box, "검토할 과제가 없습니다.");
          return;
        }
        const a = assignments.get(String(t.id)),
          p = person(t.person_id);
        add(
          box,
          el("h2", t.label),
          badge(personName(t.person_id)),
          badge(t.pjt),
          badge(H[t.horizon] || H.unknown),
          badge(S[decisions[t.id].status]),
        );
        quote(box, "과제 원문 · 등장 " + (t.occurrence ?? 1) + "회차", t.quote);
        quote(box, "시점 근거", t.time_quote);
        add(box, el("h3", "범주 · " + cat(a?.category_id)));
        quote(box, "범주 배정 이유", a?.reason);
        const categoryRecord = cm.get(String(a?.category_id));
        if (categoryRecord) {
          detail(
            box,
            "범주 정의 · 포함 · 제외",
            [
              categoryRecord.definition,
              categoryRecord.includes,
              categoryRecord.excludes,
            ].join("\n\n"),
          );
        }
        const linked = links.filter((l) => String(l.task_id) === String(t.id));
        box.append(el("h3", "연결된 역량 · " + linked.length + "개"));
        if (!linked.length)
          box.append(el("p", "연결된 역량이 없습니다.", "muted"));
        for (const l of linked) {
          const c = caps.get(String(l.capability_id));
          if (!c) {
            box.append(el("p", "참조된 역량을 찾을 수 없습니다."));
            continue;
          }
          add(box, el("h3", c.label), badge(K[c.kind] || c.kind, c.kind));
          quote(box, "역량 원문 · " + personName(c.person_id), c.quote);
          quote(box, "과제 ↔ 역량 관계 원문", l.relation_quote);
        }
        const source = el("details");
        source.open = true;
        add(
          source,
          el("summary", "작성자 전체 원문 · " + personName(t.person_id)),
          el("pre", p?.text || "원문이 제공되지 않았습니다.", "source"),
        );
        box.append(source);
        box.append(el("h3", "검토 결정"));
        const actions = el("div", undefined, "actions");
        for (const status of ["approved", "rejected", "pending"]) {
          const b = button(
            { approved: "승인", rejected: "반려", pending: "검토 대기" }[
              status
            ],
            () => {
              decisions[t.id].status = status;
              changed();
              list();
              show();
            },
            decisions[t.id].status === status ? "active" : "",
          );
          b.setAttribute(
            "aria-pressed",
            String(decisions[t.id].status === status),
          );
          actions.append(b);
        }
        box.append(actions);
        const note = field(box, "검토 메모", el("textarea"));
        note.value = decisions[t.id].note;
        note.oninput = () => {
          decisions[t.id].note = note.value;
          changed();
        };
        const categorySelect = field(box, "검토 후 과제 범주", el("select"));
        options(categorySelect, [
          ["", "미분류"],
          ...cats
            .filter((c) => c.pjt === t.pjt)
            .map((c) => [String(c.id), c.name]),
        ]);
        categorySelect.value = Object.hasOwn(decisions[t.id], "category_id")
          ? (decisions[t.id].category_id ?? "")
          : (a?.category_id ?? "");
        box.append(
          el("p", "원래 범주를 변경하면 검토 메모가 필요합니다.", "muted"),
        );
        categorySelect.onchange = () => {
          const value = categorySelect.value || null;
          decisions[t.id].category_id = value;
          changed();
        };
      }
      function correctionEditor() {
        const section = el("section", undefined, "surface");
        section.style.marginTop = "20px";
        add(
          section,
          el("h2", "사람별 추출 결과 정정"),
          el(
            "p",
            "tasks, capabilities, links를 포함한 JSON을 수정하세요. 저장한 사람만 원래 source_hash와 함께 내보냅니다. 정확한 원문·시점·연결 근거는 적용 단계에서 다시 검증합니다.",
            "muted",
          ),
        );
        if (!correctionEntries.length)
          empty(section, "정정용 추출 결과가 제공되지 않았습니다.");
        correctionEntries.forEach((entry) => {
          const d = el("details");
          d.append(
            el("summary", personName(entry.person_id) + " · 추출 결과 수정"),
          );
          detail(
            d,
            "작성자 전체 원문",
            person(entry.person_id)?.text || "원문 미제공",
          );
          const edit = field(d, "추출 결과 JSON", el("textarea"));
          edit.rows = 18;
          edit.spellcheck = false;
          edit.value = JSON.stringify(entry.extraction, null, 2);
          const feedback = el("p", "", "status");
          feedback.setAttribute("role", "status");
          edit.oninput = () => {
            drafts.set(String(entry.person_id), edit.value);
            changed();
            feedback.textContent = "수정한 JSON을 검증하고 저장하세요.";
          };
          add(
            d,
            button("JSON 검증 및 정정 저장", () => {
              try {
                const value = JSON.parse(edit.value);
                if (
                  !value ||
                  typeof value !== "object" ||
                  Array.isArray(value) ||
                  Object.keys(value).sort().join(",") !==
                    "capabilities,links,tasks" ||
                  !["tasks", "capabilities", "links"].every((k) =>
                    Array.isArray(value[k]),
                  )
                )
                  throw new Error(
                    "tasks, capabilities, links 배열이 필요합니다.",
                  );
                if (JSON.stringify(value) === JSON.stringify(entry.extraction))
                  resetCorrection(String(entry.person_id));
                else
                  corrections.set(String(entry.person_id), {
                    person_id: entry.person_id,
                    source_hash: entry.source_hash,
                    extraction: value,
                  });
                drafts.delete(String(entry.person_id));
                changed();
                feedback.textContent = corrections.has(String(entry.person_id))
                  ? "JSON 형식을 확인하고 정정을 저장했습니다."
                  : "원래 추출 결과와 같습니다. 내보내기에서 제외합니다.";
              } catch (error) {
                feedback.textContent = "저장하지 못했습니다: " + error.message;
              }
            }),
            button("정정 취소", () => {
              resetCorrection(String(entry.person_id));
              drafts.delete(String(entry.person_id));
              edit.value = JSON.stringify(entry.extraction, null, 2);
              feedback.textContent = "원래 추출 결과로 되돌렸습니다.";
              changed();
            }),
            feedback,
          );
          section.append(d);
        });
        document.querySelector("main").append(section);
      }
      function download(data, name) {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json;charset=utf-8",
          }),
          url = URL.createObjectURL(blob),
          a = el("a");
        a.href = url;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        $("message").textContent =
          "JSON 다운로드를 요청했습니다. 다운로드한 파일을 확인하세요.";
      }
      $("export").onclick = () => {
        const invalid = tasks.find(
          (t) =>
            Object.hasOwn(decisions[t.id], "category_id") &&
            decisions[t.id].category_id !==
              (originalAssignments.get(String(t.id))?.category_id ?? null) &&
            !decisions[t.id].note.trim(),
        );
        if (invalid) {
          selected = invalid.id;
          list();
          show();
          $("message").textContent =
            "범주를 변경한 과제에 검토 메모를 입력하세요: " + invalid.label;
          return;
        }
        download({ run_id: D.run_id, decisions }, "review.json");
      };
      $("correction-export").onclick = () => {
        if (drafts.size) {
          $("message").textContent =
            "저장하지 않은 정정이 있습니다. JSON 검증 및 정정 저장을 먼저 눌러 주세요.";
          return;
        }
        download({ persons: [...corrections.values()] }, "corrections.json");
      };
      $("filter").onchange = list;
      $("search").oninput = list;
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      function other() {
        const box = $("other"),
          linked = new Set(links.map((l) => String(l.capability_id))),
          loose = arr(D.capabilities).filter((c) => !linked.has(String(c.id))),
          d = el("details");
        d.append(el("summary", "과제 연결 없는 역량 · " + loose.length + "개"));
        if (!loose.length) empty(d, "과제 연결 없는 역량이 없습니다.");
        loose.forEach((c) => {
          const row = el("article", undefined, "item");
          add(
            row,
            el("h3", c.label),
            badge(K[c.kind] || c.kind, c.kind),
            el("p", personName(c.person_id)),
          );
          quote(row, "역량 원문", c.quote);
          detail(
            row,
            "작성자 전체 원문",
            person(c.person_id)?.text || "원문 미제공",
          );
          d.append(row);
        });
        box.append(d);
        const without = persons.filter(
            (p) => !tasks.some((t) => String(t.person_id) === String(p.id)),
          ),
          people = el("details");
        people.append(
          el("summary", "과제 없는 사람 · " + without.length + "명"),
        );
        if (!without.length) empty(people, "과제 없는 사람이 없습니다.");
        without.forEach((p) => detail(people, p.name + " · " + p.pjt, p.text));
        box.append(people);
      }
      list();
      show();
      other();
      correctionEditor();
    </script>
  </body>
</html>
