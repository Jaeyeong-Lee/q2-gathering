<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>각자의 다음 — Pitch Cosmos — Motion Study</title>
<style>
:root{color-scheme:dark;--ink:#111817;--paper:#eeeae1;--copper:#b45234;--mint:#9dd8c3;--peach:#edb58e}
*{box-sizing:border-box}body{margin:0;background:#151817;color:#eeeae1;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--mint);outline-offset:4px}#viewport{position:absolute;inset:0 0 90px;overflow:hidden;display:grid;place-items:center}#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center;background:var(--paper);color:var(--ink);overflow:hidden}#stage.dark{background:#101918;color:var(--paper)}canvas{position:absolute;inset:0;width:1920px;height:1080px}header{position:absolute;top:56px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:25px;letter-spacing:.02em}header strong{font-weight:600}.badge{font-size:23px;opacity:.7}#copy{position:absolute;left:94px;top:220px;pointer-events:none}h1{font-size:108px;line-height:1.1;letter-spacing:-6px;margin:0;font-weight:650}h1 em{font-family:Georgia,serif;font-weight:400;font-style:italic}#description{font-size:31px;line-height:1.65;max-width:730px;margin-top:34px;opacity:.72;white-space:pre-line}#number{font-family:Georgia,serif;font-size:370px;line-height:1;letter-spacing:-25px;margin:0 0 14px -17px;font-weight:400}#bottom{position:absolute;bottom:66px;left:94px;right:94px;display:flex;justify-content:space-between;align-items:flex-end;font-size:26px}#bottom span{opacity:.55}#scene-note{font-size:25px;text-align:right;max-width:560px;line-height:1.6}#quote{display:none;position:absolute;top:750px;left:450px;width:1020px;font-size:35px;text-align:center;line-height:1.6}#quote mark{background:none;color:var(--mint)}.center #copy{top:170px;left:0;width:100%;text-align:center}.center h1{font-size:95px}.center #description{margin:28px auto;max-width:1100px}.center #quote{display:block}nav{position:fixed;bottom:0;left:0;right:0;height:90px;display:flex;justify-content:center;align-items:center;gap:8px;background:#151817;padding:12px}nav button{background:transparent;border:1px solid #ffffff20;border-radius:5px;padding:12px 18px;font-size:14px}nav button:hover{background:#ffffff12}nav button[aria-current=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}nav button:disabled{opacity:.3;cursor:default}#mode{margin-left:24px;color:#babfb9;font-size:13px}#draft{position:absolute;top:120px;left:72px;color:var(--copper);font-size:22px}.dark #draft{color:var(--peach)}@media(max-width:760px){nav{gap:4px;flex-wrap:wrap;height:108px;padding:10px 5px}nav button{padding:9px 8px;font-size:12px}#mode{display:none}#viewport{bottom:108px}}
#scrub{position:absolute;bottom:2px;left:2%;width:96%;height:4px;accent-color:#9dd8c3}nav{padding-bottom:18px}nav[hidden]{display:none}#tweaks{position:fixed;right:28px;bottom:105px;padding:24px;background:#25322e;border:1px solid #9dd8c344;border-radius:8px;z-index:5}#tweaks label{display:block;margin-bottom:18px}#tweaks select{padding:8px;margin-left:12px}#tweaks button{background:transparent;border:1px solid #ffffff50;padding:8px 15px}#draft{font-size:22px}#copy{transition:opacity .35s}#number{font-size:315px}#quote{pointer-events:none}#stage.reflection #copy{top:300px}#stage.reflection h1{font-size:100px}.center #description{font-size:29px}#scene-note{font-size:23px}#bottom{bottom:50px}#play{min-width:68px}@media(max-width:1100px){#mode{display:none}nav button{padding:10px 9px}}@media(prefers-reduced-motion:reduce){#copy{transition:none}}</style>
<main id="viewport"><section id="stage" aria-label="발표 장면">
<canvas id="art" width="1920" height="1080" aria-hidden="true"></canvas>
<header><strong>각자의 다음.</strong><span class="badge">300개 기록을 가정한 합성 시연</span></header>
<div id="draft">모션 스터디 · 작성 과정은 상상한 연출</div>
<div id="copy"><div id="number"></div><h1 id="title"></h1><p id="description"></p></div>
<div id="quote"></div>
<footer id="bottom"><div id="chapter"></div><div id="scene-note"></div></footer>
</section></main>
<nav aria-label="장면 탐색"><button id="play">재생</button><button id="replay" aria-label="현재 장면 다시 보기">↺</button><button id="prev" aria-label="이전 장면">←</button><div id="steps" style="display:contents"></div><button id="next" aria-label="다음 장면">→</button><button id="tweaks-button">설정</button><input id="scrub" type="range" min="0" max="1" step=".001" value="0" aria-label="전체 시퀀스 탐색"><span id="mode">← → 이동 · Space 재생</span></nav><aside id="tweaks" hidden><label>진행 속도 <select id="speed"><option value="1">시연 · 100초</option><option value="0.2">발표 · 약 8분</option></select></label><label><input id="calm" type="checkbox"> 움직임 줄이기</label><button id="close-tweaks">닫기</button></aside><nav hidden></nav>
<script src="candidate-pitch-cosmos.js"></script>
</html>
