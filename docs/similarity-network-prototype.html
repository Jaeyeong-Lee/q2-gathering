<title>근원경쟁력 유사도 네트워크 — 프로토타입</title>
<style>
  :root{
    --bg: #07080b;
    --panel: rgba(20, 23, 31, 0.74);
    --panel-border: rgba(255, 255, 255, 0.09);
    --ink: #f1f3f7;
    --ink-dim: #8b93a3;
    --ink-faint: #545c6b;
    --gold: #f3cc73;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
    --sans: "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(87,201,189,0.07), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(242,161,84,0.05), transparent 55%),
      var(--bg);
  }

  canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas.dragging{ cursor: grabbing; }

  .topbar{
    position: absolute;
    top: clamp(18px, 3vh, 32px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .topbar h1{
    margin: 0;
    font-size: clamp(18px, 2.1vw, 26px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .topbar .sub{
    margin-top: 6px;
    font-size: clamp(12px, 1vw, 14px);
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .badge{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #1a1608;
    background: var(--gold);
  }
  .badge::before{
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #1a1608;
    opacity: 0.6;
  }

  .panel{
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .search-panel{
    top: clamp(18px, 3vh, 32px);
    left: clamp(18px, 3vw, 32px);
    width: min(280px, 30vw);
    padding: 10px;
    z-index: 6;
  }
  .search-row{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 9px;
    background: rgba(255,255,255,0.04);
  }
  .search-row svg{ flex: none; opacity: 0.55; }
  #searchInput{
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
  }
  #searchInput::placeholder{ color: var(--ink-faint); }
  .search-row:focus-within{ box-shadow: 0 0 0 2px var(--gold); }
  #clearBtn{
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 4px;
    display: none;
  }
  #clearBtn:hover{ color: var(--ink); }
  #clearBtn:focus-visible{ outline: 2px solid var(--gold); border-radius: 4px; }

  .search-results{ max-height: 260px; overflow-y: auto; margin-top: 6px; }
  .result-item{
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 8px; background: none; border: none;
    color: var(--ink); font-family: var(--sans); font-size: 13.5px; cursor: pointer;
  }
  .result-item:hover, .result-item:focus-visible{ background: rgba(255,255,255,0.07); outline: none; }
  .dot{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .result-item .team-name{ color: var(--ink-faint); font-size: 11.5px; margin-left: auto; white-space: nowrap; }
  .search-count{ font-size: 11px; color: var(--ink-faint); padding: 4px 8px 0; }

  .side-panel{
    left: clamp(18px, 3vw, 32px);
    bottom: clamp(18px, 3vh, 28px);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 5;
    width: min(240px, 28vw);
  }
  .panel-title{
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint);
  }
  .isolate-clear{
    background: none; border: none; color: var(--gold); font-family: var(--sans);
    font-size: 10.5px; font-weight: 700; cursor: pointer; letter-spacing: 0; text-transform: none;
    padding: 0;
  }
  .isolate-clear:hover{ text-decoration: underline; }
  .legend-list{ display: flex; flex-direction: column; gap: 2px; }
  .team-chip{
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim);
    background: none; border: none; width: 100%; text-align: left; padding: 5px 4px;
    border-radius: 7px; cursor: pointer; font-family: var(--sans);
  }
  .team-chip:hover{ background: rgba(255,255,255,0.05); }
  .team-chip:focus-visible{ outline: 2px solid var(--gold); }
  .team-chip.dimmed-off{ opacity: 0.4; }
  .team-chip.isolated{ color: var(--ink); background: rgba(255,255,255,0.07); }
  .team-chip .dot{ width: 9px; height: 9px; }
  .team-chip .count{ margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

  .topn-row{
    padding-top: 10px; border-top: 1px solid var(--panel-border);
    display: flex; flex-direction: column; gap: 6px;
  }
  .topn-label{ display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }
  .topn-label b{ color: var(--gold); font-family: var(--mono); font-weight: 600; }
  #topnSlider{ width: 100%; accent-color: var(--gold); }
  #topnSlider:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }
  .hint{ font-size: 10.5px; color: var(--ink-faint); line-height: 1.5; }

  .reset-btn{
    position: absolute;
    right: clamp(18px, 3vw, 32px);
    bottom: clamp(18px, 3vh, 28px);
    z-index: 6;
    padding: 10px 16px;
    border-radius: 100px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    backdrop-filter: blur(16px);
    color: var(--ink-dim);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .reset-btn.visible{ opacity: 1; transform: translateY(0); color: var(--ink); }
  .reset-btn:hover{ border-color: rgba(255,255,255,0.2); }
  .reset-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  .detail-panel{
    top: clamp(18px, 3vh, 32px);
    right: clamp(18px, 3vw, 32px);
    width: min(320px, 32vw);
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding: 20px;
    z-index: 6;
    opacity: 0;
    transform: translateX(16px);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .detail-panel.visible{ opacity: 1; transform: translateX(0); pointer-events: auto; }

  .detail-name{ font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .detail-team{
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
    padding: 3px 10px 3px 8px; border-radius: 100px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.06);
  }
  .detail-flavor{
    margin-top: 14px; font-size: 13px; line-height: 1.6; color: var(--ink-dim);
    padding-top: 12px; border-top: 1px solid var(--panel-border);
  }
  .detail-flavor .label{
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); margin-bottom: 5px;
  }
  .detail-flavor .tbd{ display: inline-block; margin-left: 6px; font-size: 10px; color: var(--ink-faint); font-family: var(--mono); }

  .neighbor-label{
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--panel-border);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 10px;
  }
  .neighbor-list{ display: flex; flex-direction: column; gap: 3px; }
  .neighbor-item{
    display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 9px; width: 100%;
    background: none; border: none; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    text-align: left; color: var(--ink); font-family: var(--sans);
  }
  .neighbor-item:hover, .neighbor-item:focus-visible{ background: rgba(255,255,255,0.06); outline: none; }
  .neighbor-item .n-name{ font-size: 13.5px; }
  .neighbor-item .n-score{ font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  .neighbor-item .n-bar-track{
    grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.06);
    margin-top: 2px; overflow: hidden;
  }
  .neighbor-item .n-bar-fill{ height: 100%; border-radius: 2px; }

  .hover-tip{
    position: absolute;
    z-index: 7;
    pointer-events: none;
    background: rgba(8,9,13,0.92);
    border: 1px solid var(--panel-border);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    transform: translate(-50%, -140%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .hover-tip.show{ opacity: 1; }
  .hover-tip .pct{ color: var(--gold); font-family: var(--mono); font-weight: 700; margin-left: 6px; }
  .hover-tip .team{ color: var(--ink-faint); font-weight: 500; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 4px; }

  @media (prefers-reduced-motion: reduce){
    .reset-btn, .detail-panel, .hover-tip{ transition: none; }
  }
</style>

<div class="stage">
  <canvas id="graph"></canvas>
  <div class="hover-tip" id="hoverTip"></div>

  <header class="topbar">
    <h1>근원경쟁력 유사도 네트워크</h1>
    <div class="sub">
      <span>2026 Q2 분기회 라이브 데모</span>
      <span class="badge">프로토타입 · 더미 데이터</span>
    </div>
  </header>

  <div class="panel search-panel">
    <div class="search-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="이름으로 검색 (150명)" autocomplete="off" />
      <button id="clearBtn" aria-label="검색어 지우기" title="검색어 지우기">×</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="panel side-panel">
    <div>
      <div class="panel-title">
        <span>소속팀 (클릭: dim · 더블클릭: 이 팀만)</span>
        <button class="isolate-clear" id="isolateClear" style="display:none">전체 팀 보기</button>
      </div>
      <div class="legend-list" id="legend"></div>
    </div>
    <div class="topn-row">
      <div class="topn-label"><span>전체 뷰 연결 수 (Top-N)</span><b id="topnValue">5</b></div>
      <input type="range" id="topnSlider" min="2" max="12" value="5" step="1" aria-label="전체 뷰에서 인당 유사도 상위 N명 연결" />
      <div class="hint">인물 클릭 시엔 유사도 상위 10명 궤도 뷰로 전환됩니다.</div>
    </div>
  </div>

  <button class="reset-btn" id="resetBtn">전체 뷰로 돌아가기</button>

  <aside class="panel detail-panel" id="detailPanel"></aside>
</div>

    var entries = target.entries.map(function(e){
      var curR = e.node.animR != null ? e.node.animR : overviewRadius(e.node);
      return { node: e.node, fromX: e.node.x, fromY: e.node.y, toX: e.tx, toY: e.ty, fromR: curR, toR: e.tr };
    });
    selectedId = id;
    egoNeighbors = target.neighbors;
    viewMode = "ego";
    egoAnim = { start: performance.now(), duration: EGO_TRANSITION_MS, entries: entries };
    egoRevealStart = performance.now() + EGO_TRANSITION_MS;
    ripples.push({ x: byId[id].x, y: byId[id].y, color: TEAM_COLOR[byId[id].team] || DEFAULT_COLOR, start: performance.now() });
    alpha = Math.max(alpha, 0.05);
    renderDetail();
    resetBtn.classList.add("visible");
  }

  function exitEgo(){
    if (viewMode !== "ego") return;
    var fg = [byId[selectedId]].concat(egoNeighbors.map(function(nb){ return nb.node; }));
    var entries = fg.map(function(n){
      return { node: n, fromX: n.x, fromY: n.y, toX: n.homeX != null ? n.homeX : n.x, toY: n.homeY != null ? n.homeY : n.y };
    });
    // 복귀: 에고 진입 직전의 오버뷰 좌표(homeX/Y)로 부드럽게 돌아간 뒤 물리 재개
    egoAnim = { start: performance.now(), duration: EGO_TRANSITION_MS, entries: entries, exiting: true };
    viewMode = "overview";
    selectedId = null;
    egoNeighbors = [];
    egoRevealStart = null;
    detailPanel.classList.remove("visible");
    resetBtn.classList.remove("visible");
    alpha = Math.max(alpha, 0.35);
  }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  function updateEgoTransition(){
    if (!egoAnim) return;
    var now = performance.now();
    var t = Math.min(1, (now - egoAnim.start) / egoAnim.duration);
    var e = easeOutCubic(t);
    egoAnim.entries.forEach(function(entry){
      entry.node.x = entry.fromX + (entry.toX - entry.fromX) * e;
      entry.node.y = entry.fromY + (entry.toY - entry.fromY) * e;
      if (entry.toR !== undefined){
        entry.node.animR = (entry.fromR || entry.node.r) + ((entry.toR - (entry.fromR || entry.node.r)) * e);
      }
    });
    if (t >= 1){
      if (egoAnim.exiting){
        egoAnim.entries.forEach(function(entry){ entry.node.animR = null; });
      }
      egoAnim = null;
    }
  }

  // ---------------- 인터랙션 상태 ----------------
  var hoverId = null;
  var dragNode = null;
  var dragPos = { x: 0, y: 0 };
  var dragMoved = false;
  var downPos = null;

  function egoActiveIds(){
    if (viewMode !== "ego") return null;
    var set = {};
    set[selectedId] = true;
    egoNeighbors.forEach(function(nb){ set[nb.node.id] = true; });
    return set;
  }

  function revealedCount(){
    if (egoRevealStart === null) return egoNeighbors.length;
    var elapsed = performance.now() - egoRevealStart;
    if (elapsed <= 0) return 0;
    return Math.min(egoNeighbors.length, Math.floor(elapsed / REVEAL_STAGGER_MS) + 1);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    var active = egoActiveIds();
    var revealed = active ? revealedCount() : 0;
    var revealedIds = null;
    if (active){
      revealedIds = {};
      for (var i = 0; i < revealed; i++) revealedIds[egoNeighbors[i].node.id] = true;
    }

    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;

    // 엣지
    if (active){
      // 에고 모드: 선택 인물 -> 공개된 이웃까지만 순차 점등 (막 나타난 엣지는 페이드인)
      var revealNow = performance.now();
      egoNeighbors.forEach(function(nb, i){
        if (i >= revealed) return;
        var sel = byId[selectedId];
        var fadeT = Math.min(1, Math.max(0, (revealNow - (egoRevealStart + i * REVEAL_STAGGER_MS)) / REVEAL_STAGGER_MS));
        ctx.beginPath();
        ctx.moveTo(sel.x, sel.y);
        ctx.lineTo(nb.node.x, nb.node.y);
        ctx.strokeStyle = "rgba(243,204,115," + (fadeT * (0.4 + Math.max(nb.w, 0) * 0.45)) + ")";
        ctx.lineWidth = 1 + Math.max(nb.w, 0) * 4.5;
        ctx.stroke();
      });
    } else {
      edges.forEach(function(e){
        if (!e.a.visible || !e.b.visible) return;
        ctx.beginPath();
        ctx.moveTo(e.a.x, e.a.y);
        ctx.lineTo(e.b.x, e.b.y);
        ctx.strokeStyle = "rgba(180,190,205," + (0.06 + e.w * 0.2) + ")";
        ctx.lineWidth = 0.5 + Math.max(e.w, 0) * 1.3;
        ctx.stroke();
      });
    }

    // 노드
    pool.forEach(function(n){
      if (!n.visible) return;
      var inTeamFilter = !isFilterActive() || filterTeams[n.team];
      var dim = active ? !active[n.id] : !inTeamFilter;
      var isSelected = n.id === selectedId;
      var isHover = n.id === hoverId;
      var showLabel = active ? (isSelected || (revealedIds && revealedIds[n.id])) : isHover;
      var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
      var op = dim ? 0.13 : 1;
      var r = n.animR != null ? n.animR : (active ? n.r : overviewRadius(n));
      if (isHover && !isSelected) r += 1.5;

      ctx.save();
      ctx.globalAlpha = op;

      // 상시 네온 글로우 (dim 상태에선 은은하게만)
      var glow = getGlowSprite(color);
      var gs = r * (dim ? 3.2 : 5);
      ctx.globalAlpha = op * (dim ? 0.5 : 0.9);
      ctx.drawImage(glow, n.x - gs/2, n.y - gs/2, gs, gs);

      ctx.globalAlpha = op;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      if (isSelected){
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = GOLD;
        ctx.stroke();
      }
      ctx.restore();

      if (showLabel){
        ctx.save();
        ctx.globalAlpha = 1;
        ctx.font = (isSelected ? "700 " : "500 ") + "12px " + getComputedStyle(document.body).fontFamily;
        ctx.fillStyle = "#f1f3f7";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(n.name, n.x, n.y + r + 4);
        ctx.restore();
      }
    });

    // 클릭 리플
    var now = performance.now();
    ripples = ripples.filter(function(rp){ return now - rp.start < RIPPLE_MS; });
    ripples.forEach(function(rp){
      var t = (now - rp.start) / RIPPLE_MS;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, 12 + t * 46, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = rp.color;
      ctx.stroke();
      ctx.restore();
    });
  }

  function loop(){
    tick();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------- 마우스 인터랙션 ----------------
  function nodeAt(px, py){
    var hit = null, hitDist = Infinity;
    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;
    pool.forEach(function(n){
      if (!n.visible) return;
      var dx = n.x - px, dy = n.y - py;
      var d = Math.sqrt(dx * dx + dy * dy);
      var hitR = (n.animR != null ? n.animR : n.r) + 6;
      if (d < hitR && d < hitDist){ hit = n; hitDist = d; }
    });
    return hit;
  }

  function getPos(evt){
    var rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  var hoverTip = document.getElementById("hoverTip");

  canvas.addEventListener("mousedown", function(evt){
    var p = getPos(evt);
    downPos = p;
    dragMoved = false;
    var n = nodeAt(p.x, p.y);
    if (n && viewMode === "overview"){
      dragNode = n;
      dragPos.x = n.x; dragPos.y = n.y;
      canvas.classList.add("dragging");
      alpha = Math.max(alpha, 0.3);
    }
  });

  window.addEventListener("mousemove", function(evt){
    var p = getPos(evt);
    if (dragNode){
      dragPos = p;
      if (downPos && (Math.abs(p.x - downPos.x) > 3 || Math.abs(p.y - downPos.y) > 3)) dragMoved = true;
      hoverTip.classList.remove("show");
    } else {
      var rect = canvas.getBoundingClientRect();
      var inCanvas = evt.clientX >= rect.left && evt.clientX <= rect.right && evt.clientY >= rect.top && evt.clientY <= rect.bottom;
      var n = inCanvas ? nodeAt(p.x, p.y) : null;
      var newHover = n ? n.id : null;
      if (newHover !== hoverId){
        hoverId = newHover;
        canvas.style.cursor = n ? "pointer" : "grab";
      }
      if (n){
        hoverTip.style.left = p.x + "px";
        hoverTip.style.top = p.y + "px";
        var html = escapeHtml(n.name) + ' <span class="team">· ' + escapeHtml(n.team) + '</span>';
        if (viewMode === "ego" && n.id !== selectedId){
          var nb = egoNeighbors.filter(function(x){ return x.node.id === n.id; })[0];
          if (nb) html += '<span class="pct">' + Math.round(Math.max(nb.w, 0) * 100) + '%</span>';
        }
        hoverTip.innerHTML = html;
        hoverTip.classList.add("show");
      } else {
        hoverTip.classList.remove("show");
      }
    }
  });

  window.addEventListener("mouseup", function(evt){
    if (dragNode){
      var n = dragNode;
      dragNode = null;
      canvas.classList.remove("dragging");
      if (!dragMoved) enterEgo(n.id);
      alpha = Math.max(alpha, 0.15);
    } else {
      var p = getPos(evt);
      var rect = canvas.getBoundingClientRect();
      var inCanvas = evt.clientX >= rect.left && evt.clientX <= rect.right && evt.clientY >= rect.top && evt.clientY <= rect.bottom;
      var hit = inCanvas ? nodeAt(p.x, p.y) : null;
      if (hit){
        if (viewMode === "overview" || hit.id !== selectedId) enterEgo(hit.id);
      } else if (inCanvas){
        exitEgo();
      }
    }
    downPos = null;
  });

  window.addEventListener("keydown", function(evt){
    if (evt.key === "Escape") exitEgo();
  });

  // ---------------- 사이드 패널 (선택 인물 상세) ----------------
  var detailPanel = document.getElementById("detailPanel");
  var resetBtn = document.getElementById("resetBtn");
  resetBtn.addEventListener("click", exitEgo);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderDetail(){
    var n = byId[selectedId];
    if (!n){ detailPanel.classList.remove("visible"); return; }
    var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
    var neighbors = egoNeighbors;

    var html = "";
    html += '<div class="detail-name">' + escapeHtml(n.name) + "</div>";
    html += '<div class="detail-team" style="background:' + color + '22;color:' + color + '">';
    html += '<span class="dot" style="background:' + color + '"></span>' + escapeHtml(n.team) + "</div>";
    html += '<div class="detail-flavor"><span class="label">역량 · 경력 (더미)</span>' + escapeHtml(n.flavor);
    html += '<span class="tbd">근거 텍스트 원문 연동 TBD</span></div>';
    html += '<div class="neighbor-label">유사도 상위 ' + neighbors.length + '명</div>';
    html += '<div class="neighbor-list">';
    neighbors.forEach(function(nb){
      var nc = TEAM_COLOR[nb.node.team] || DEFAULT_COLOR;
      var pct = Math.max(0, Math.min(1, nb.w)) * 100;
      html += '<button class="neighbor-item" data-id="' + nb.node.id + '">';
      html += '<span class="dot" style="background:' + nc + '"></span>';
      html += '<span class="n-name">' + escapeHtml(nb.node.name) + '</span>';
      html += '<span class="n-score">' + nb.w.toFixed(3) + '</span>';
      html += '<span class="n-bar-track"><span class="n-bar-fill" style="width:' + pct + '%;background:' + nc + '"></span></span>';
      html += '</button>';
    });
    html += '</div>';

    detailPanel.innerHTML = html;
    detailPanel.classList.add("visible");

    detailPanel.querySelectorAll(".neighbor-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        enterEgo(parseInt(btn.getAttribute("data-id"), 10));
      });
    });
  }

  // ---------------- 검색 (실시간 펄스 하이라이트 포함) ----------------
  var searchInput = document.getElementById("searchInput");
  var searchResults = document.getElementById("searchResults");
  var clearBtn = document.getElementById("clearBtn");

  function renderResults(query){
    searchResults.innerHTML = "";
    if (!query){ clearBtn.style.display = "none"; return; }
    clearBtn.style.display = "block";
    var pool = isolateTeam ? nodes.filter(function(n){ return n.team === isolateTeam; }) : nodes;
    var matches = pool.filter(function(n){ return n.name.indexOf(query) !== -1; });
    var shown = matches.slice(0, 8);
    shown.forEach(function(n){
      var item = document.createElement("button");
      item.className = "result-item";
      var color = TEAM_COLOR[n.team] || DEFAULT_COLOR;
      item.innerHTML = '<span class="dot" style="background:' + color + '"></span>' +
        '<span>' + escapeHtml(n.name) + '</span>' +
        '<span class="team-name">' + escapeHtml(n.team) + '</span>';
      item.addEventListener("click", function(){
        enterEgo(n.id);
        searchInput.value = n.name;
        searchResults.innerHTML = "";
      });
      searchResults.appendChild(item);
    });
    if (matches.length > shown.length){
      var count = document.createElement("div");
      count.className = "search-count";
      count.textContent = "+" + (matches.length - shown.length) + "명 더 (검색어를 좁혀보세요)";
      searchResults.appendChild(count);
    }
  }

  searchInput.addEventListener("input", function(){ renderResults(searchInput.value.trim()); });
  searchInput.addEventListener("keydown", function(evt){
    if (evt.key === "Enter"){
      var first = searchResults.querySelector(".result-item");
      if (first) first.click();
    } else if (evt.key === "Escape") {
      searchInput.value = "";
      renderResults("");
      searchInput.blur();
    }
  });
  clearBtn.addEventListener("click", function(){
    searchInput.value = "";
    renderResults("");
    searchInput.focus();
  });

  // ---------------- 팀 범례: 클릭(dim) / 더블클릭(격리) ----------------
  var legend = document.getElementById("legend");
  var isolateClearBtn = document.getElementById("isolateClear");
  var teamCounts = {};
  nodes.forEach(function(n){ teamCounts[n.team] = (teamCounts[n.team] || 0) + 1; });

  var chipEls = {};
  Object.keys(TEAM_COLOR).forEach(function(team){
    var chip = document.createElement("button");
    chip.className = "team-chip";
    chip.innerHTML = '<span class="dot" style="background:' + TEAM_COLOR[team] + '"></span>' +
      '<span>' + escapeHtml(team) + '</span>' +
      '<span class="count">' + (teamCounts[team] || 0) + '</span>';

    var clickTimer = null;
    chip.addEventListener("click", function(){
      if (clickTimer) return;
      clickTimer = setTimeout(function(){
        clickTimer = null;
        if (isolateTeam) return; // 격리 중엔 단일 클릭 dim 토글 비활성화
        if (filterTeams[team]) delete filterTeams[team]; else filterTeams[team] = true;
        refreshChips();
      }, 230);
    });
    chip.addEventListener("dblclick", function(){
      if (clickTimer){ clearTimeout(clickTimer); clickTimer = null; }
      isolateTeam = (isolateTeam === team) ? null : team;
      filterTeams = {};
      if (viewMode === "ego") exitEgo();
      rebuildEdges();
      recomputeMaxDegree();
      nodes.forEach(function(n){ n._placed = false; });
      alpha = 1;
      refreshChips();
    });

    legend.appendChild(chip);
    chipEls[team] = chip;
  });

  function refreshChips(){
    Object.keys(chipEls).forEach(function(team){
      var chip = chipEls[team];
      chip.classList.toggle("isolated", isolateTeam === team);
      chip.classList.toggle("dimmed-off", isFilterActive() && !filterTeams[team] && !isolateTeam);
    });
    isolateClearBtn.style.display = isolateTeam ? "inline" : "none";
  }
  isolateClearBtn.addEventListener("click", function(){
    isolateTeam = null;
    filterTeams = {};
    rebuildEdges();
    recomputeMaxDegree();
    nodes.forEach(function(n){ n._placed = false; });
    alpha = 1;
    refreshChips();
  });

  // ---------------- Top-N 슬라이더 (전체 뷰 전용) ----------------
  var topnSlider = document.getElementById("topnSlider");
  var topnValue = document.getElementById("topnValue");
  topnSlider.value = topN;
  topnValue.textContent = topN;
  topnSlider.addEventListener("input", function(){
    topN = parseInt(topnSlider.value, 10);
    topnValue.textContent = topN;
    rebuildEdges();
    recomputeMaxDegree();
    alpha = Math.max(alpha, 0.5);
  });

  // ---------------- 시작 ----------------
  resize();
  loop();
})();
</script>
