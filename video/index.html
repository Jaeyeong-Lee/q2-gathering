<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const NS='http://www.w3.org/2000/svg';
const COLS=2;
function el(tag,attrs){const e=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}

/* ── position functions (ported from nebula.template.html) ── */
const originals=new Map();
D.people.forEach((p,i)=>{
  if(p.x!==null) originals.set(p.id,[100+p.x*950,95+p.y*465]);
  else{const a=(i/D.people.length)*Math.PI*2-Math.PI/2;originals.set(p.id,[575+Math.cos(a)*440,327+Math.sin(a)*215]);}
});
function pjtCell(i){
  const rows=Math.max(1,Math.ceil(D.pjts.length/COLS)),w=1040/COLS,h=480/rows;
  return{x:80+(i%COLS)*w,y:115+Math.floor(i/COLS)*h,width:w,height:h};
}
function ring(index,total,rx,ry){
  const a=(index/Math.max(1,total))*Math.PI*2-Math.PI/2;
  return total<2?[0,0]:[Math.cos(a)*rx,Math.sin(a)*ry];
}
function clusterCenter(c){
  const sib=D.categories.filter(x=>x.pjt===c.pjt),idx=sib.findIndex(x=>x.id===c.id);
  const[dx,dy]=ring(idx,sib.length,265,160);return[555+dx,375+dy];
}
function offsets(t,r){
  const angle=t.seed*Math.PI*2,dist=Math.sqrt((Math.sin(t.seed*7919)+1)/2)*r;
  return[Math.cos(angle)*dist,Math.sin(angle)*dist*.72];
}
function phase1Pos(t){const p=originals.get(t.person),a=t.seq*2.1+t.seed;return[p[0]+Math.cos(a)*22,p[1]+Math.sin(a)*22];}
function pjtCellPos(t){const c=pjtCell(t.pjt),o=offsets(t,Math.min(c.width*.39,c.height*.4));return[c.x+c.width/2+o[0],c.y+c.height*.59+o[1]];}
function clusterPos(t){const c=D.categories.find(x=>x.id===t.category),[cx,cy]=clusterCenter(c),o=offsets(t,115);return[cx+o[0],cy+o[1]];}

/* ── create person nodes ── */
const personNodes=[];
D.people.forEach(p=>{
  const[x,y]=originals.get(p.id),c=D.pjts[p.pjt].color;
  const g=el('g',{class:'person'});
  g.append(el('circle',{r:14,fill:c,opacity:.19,filter:'url(#starGlow)'}),el('circle',{r:5,fill:c}));
  document.getElementById('persons').append(g);personNodes.push(g);
});

/* ── create task nodes + precompute positions ── */
const taskNodes=[],p1Pos=[],cellP=[],clustP=[],pjt0Idx=[],pjt1Idx=[];
D.tasks.forEach((t,i)=>{
  const[a,b]=phase1Pos(t),[c,d]=pjtCellPos(t),[e,f]=clusterPos(t),col=D.pjts[t.pjt].color;
  const g=el('g',{class:'task'});
  g.append(el('circle',{r:9,fill:col,opacity:.34,filter:'url(#starGlow)'}),el('circle',{r:2.9,fill:col,class:'core'}));
  document.getElementById('tasks').append(g);
  taskNodes.push(g);p1Pos.push([a,b]);cellP.push([c,d]);clustP.push([e,f]);
  if(t.pjt===0)pjt0Idx.push(i);else pjt1Idx.push(i);
});

/* ── set hero-frame positions (static, before GSAP timeline) ── */
gsap.set(taskNodes,{x:i=>p1Pos[i][0],y:i=>p1Pos[i][1]});
gsap.set(personNodes,{x:i=>originals.get(D.people[i].id)[0],y:i=>originals.get(D.people[i].id)[1]});

/* ── create PJT cell outlines + labels ── */
const cellRects=[],cellLabels=[];
D.pjts.forEach((pjt,i)=>{
  const cell=pjtCell(i);
  const rect=el('rect',{x:cell.x,y:cell.y,width:cell.width,height:cell.height,fill:'none',stroke:pjt.color,'stroke-width':1.5,'stroke-opacity':.3,rx:12});
  document.getElementById('cells').append(rect);cellRects.push(rect);
  const label=el('text',{x:cell.x+cell.width/2,y:cell.y+32,'text-anchor':'middle',fill:pjt.color,'font-size':16,'font-family':'"Apple SD Gothic Neo",sans-serif','font-weight':'500','letter-spacing':'.05em'});
  label.textContent=pjt.name;document.getElementById('labels').append(label);cellLabels.push(label);
});

/* ── create nebula clouds + category labels (PJT 0 only) ── */
const nebulaGroups=[],catLabels=[];
D.categories.filter(c=>c.pjt===0).forEach(c=>{
  const[cx,cy]=clusterCenter(c),col=D.pjts[0].color;
  const neb=el('g',{});
  neb.append(
    el('ellipse',{cx,cy,rx:160,ry:100,fill:col,opacity:.2,filter:'url(#gas)',transform:'rotate(-22 '+cx+' '+cy+')'}),
    el('ellipse',{cx:cx+160*.23,cy:cy-100*.18,rx:160*.68,ry:100*.48,fill:col,opacity:.13,filter:'url(#blur)',transform:'rotate(24 '+cx+' '+cy+')'})
  );
  document.getElementById('nebulas').append(neb);nebulaGroups.push(neb);
  const label=el('text',{x:cx,y:cy-103,'text-anchor':'middle',fill:'#d9d2ee','font-size':16,'font-family':'"Apple SD Gothic Neo",sans-serif','font-weight':'500'});
  label.textContent=c.name;document.getElementById('labels').append(label);catLabels.push(label);
});

/* ── hide non-phase-1 elements ── */
gsap.set([cellRects,cellLabels,nebulaGroups,catLabels],{opacity:0});

/* ── build timeline ── */
const tl=gsap.timeline({paused:true});

/* phase 0: entrance (0 → 1.5s) */
tl.from(taskNodes,{opacity:0,scale:.2,duration:.8,stagger:.004,ease:'power2.out'},0);
tl.from(personNodes,{opacity:0,duration:.6,stagger:.008,ease:'power2.out'},0);

/* phase 1→2: move tasks to PJT cells (1.5 → 3.5s) */
tl.to(taskNodes,{x:i=>cellP[i][0],y:i=>cellP[i][1],duration:2,ease:'power2.inOut'},1.5);
tl.to(personNodes,{opacity:0,duration:1,ease:'power2.inOut'},1.5);
tl.to(cellRects,{opacity:1,duration:.8,stagger:.1,ease:'power2.out'},2.2);
tl.to(cellLabels,{opacity:1,duration:.8,stagger:.1,ease:'power2.out'},2.4);

/* phase 2→3: highlight PJT 0 (3.5 → 4.5s) */
tl.to(pjt1Idx.map(i=>taskNodes[i]),{opacity:.12,duration:.6,ease:'power2.inOut'},3.5);
tl.to(cellRects[1],{'stroke-opacity':.08,duration:.6},3.5);
tl.to(cellLabels[1],{opacity:.12,duration:.6},3.5);
tl.to(cellRects[0],{'stroke-opacity':.55,'stroke-width':2.5,duration:.6},3.5);

/* phase 3→4: PJT 0 tasks → cluster nebula (4.5 → 7s) */
const pjt0Clust=pjt0Idx.map(i=>clustP[i]);
tl.to(pjt0Idx.map(i=>taskNodes[i]),{x:(j)=>pjt0Clust[j][0],y:(j)=>pjt0Clust[j][1],duration:2.5,ease:'power2.inOut'},4.5);
tl.to(nebulaGroups,{opacity:1,duration:1.5,stagger:.15,ease:'power2.out'},5);
tl.to(catLabels,{opacity:1,duration:1,stagger:.1,ease:'power2.out'},5.5);
/* hide cell outlines during nebula phase */
tl.to(cellRects,{opacity:0,duration:.8,ease:'power2.inOut'},4.5);
tl.to(cellLabels,{opacity:0,duration:.8,ease:'power2.inOut'},4.5);

/* phase 4: hold (7 → 8s) — nothing, just let it breathe */

window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
tl.seek(0);
</script>
